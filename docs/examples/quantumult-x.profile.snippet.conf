# Personal Quantumult X profile snippet.
#
# Copy the [general] parser line and the [server_remote] line into a stable
# local profile. Do not import Nexitally's full configuration file after
# this snippet is in place: that download replaces [policy], filters, and
# rewrites. Refresh only the Nexitally server resource.

[general]
# Quantumult X allows one resource_parser_url. This dedicated extractor
# must stay pointed at nexitally-node-parser.js while the Nexitally
# resource has opt-parser=true. Leave opt-parser unset (or false) on
# every other remote resource.
#
# Prefer the raw GitHub URL after a parser change. jsDelivr is a CDN
# cache and can lag behind main.
resource_parser_url = https://raw.githubusercontent.com/sapphireran/quanx-resource-parsers/main/nexitally-node-parser.js
;resource_parser_url = https://cdn.jsdelivr.net/gh/sapphireran/quanx-resource-parsers@main/nexitally-node-parser.js

server_check_url = http://www.apple.com/generate_204

[server_remote]
# Replace the placeholder with the private Quantumult X full-configuration
# URL from the Nexitally dashboard. Keep that URL only on this device.
<YOUR_PRIVATE_NEXITALLY_QUANTUMULT_X_URL>, tag=Nexitally, opt-parser=true, update-interval=21600, enabled=true

# Other subscriptions stay as ordinary Quantumult X server lists.
# Do not set opt-parser=true on them while this parser is installed.
;https://example.com/other-quantumult-x-servers.txt, tag=Other, opt-parser=false, update-interval=86400, enabled=true

[policy]
# resource-tag-regex matches the server_remote tag, not individual node names.
static = Nexitally, resource-tag-regex=^Nexitally, img-url=https://example.com/icon.png
available = Nexitally-Auto, resource-tag-regex=^Nexitally, check-interval=600
static = Proxy, Nexitally, Nexitally-Auto, direct

[filter_remote]
; Personal filter lists remain in this local profile.

[rewrite_remote]
; Personal rewrite lists remain in this local profile.
