# Sample Nexitally-style Quantumult X full configuration.
#
# This is a sanitized stand-in for the file Nexitally exports from
# Configuration File → Download. Hosts use reserved example names.
# Passwords and keys are placeholders. Do not treat this as a working
# subscription, and never replace these values with a real account export
# inside this repository.
#
# The parser reads only [server_local]. Every other section is ignored so a
# local Quantumult X profile can keep its own [policy], [filter_remote],
# and rewrite lists when nodes refresh.

[general]
profile_img_url = https://example.com/nexitally.png
server_check_url = http://www.apple.com/generate_204
server_check_timeout = 5000

[dns]
no-ipv6
server = 223.5.5.5
server = 8.8.8.8

[policy]
static = Nexitally, resource-tag-regex=^Nexitally, server-tag-regex=^(HK|JP|SG|US), img-url=https://example.com/icon.png
available = Nexitally-Auto, resource-tag-regex=^Nexitally, server-tag-regex=^(HK|JP|SG|US)

[server_remote]
; Nexitally's downloaded profile may list other remote resources.
; Those URLs must stay out of this repository. The parser does not
; read this section.

[server_local]
; Account / plan placeholders that must not become nodes.
shadowsocks=info.example.invalid:80, method=chacha20, password=placeholder, tag=Traffic: 128.50 GB
shadowsocks=info.example.invalid:80, method=chacha20, password=placeholder, tag=Expire: 2026-12-31
shadowsocks=info.example.invalid:80, method=chacha20, password=placeholder, tag=Reset: 7 Days Left
shadowsocks=info.example.invalid:80, method=chacha20, password=placeholder, tag=流量: 500 GB
shadowsocks=info.example.invalid:80, method=chacha20, password=placeholder, tag=到期: 2026-12-31
shadowsocks=info.example.invalid:80, method=chacha20, password=placeholder, tag=剩余 12 天
shadowsocks=info.example.invalid:80, method=chacha20, password=placeholder, tag=套餐: Smart Access
anytls=premium.example.invalid:443, password=placeholder, over-tls=true, tls-host=www.apple.com, udp-relay=true, tag=[Premium] HK Residential 01

; Comments and blank lines are ignored.
# HK comment
// JP comment

; Duplicate of the first kept AnyTLS line. The second copy is dropped.
anytls=hk-iplc-01.example.invalid:443, password=placeholder, over-tls=true, tls-host=www.apple.com, udp-relay=true, tag=HK IPLC 01
anytls=hk-iplc-01.example.invalid:443, password=placeholder, over-tls=true, tls-host=www.apple.com, udp-relay=true, tag=HK IPLC 01

; Supported Quantumult X server formats. AnyTLS Reality uses the official
; Quantumult X 1.6.0 field names from crossutility/Quantumult-X sample.conf.
anytls=jp-iepl-01.example.invalid:443, password=placeholder, over-tls=true, tls-host=www.apple.com, udp-relay=true, tag=JP IEPL 01
anytls=sg-anycast-01.example.invalid:443, password=placeholder, over-tls=true, tls-host=www.apple.com, reality-base64-pubkey=k4Uxez0sjl8bKaZH2Vgi8-WDFshML51QkxKFLWFIONk, reality-hex-shortid=0123456789abcdef, udp-relay=true, tag=SG Anycast Reality 01
shadowsocks=us-ss-01.example.invalid:443, method=2022-blake3-aes-128-gcm, password=BJDBGeLKx/JbEACCSN5rRg==, obfs=over-tls, obfs-host=www.apple.com, tls-verification=true, udp-relay=true, tag=US SS2022 01
vmess=us-vmess-01.example.invalid:443, method=chacha20-poly1305, password=23ad6b10-8d1a-40f7-8ad0-e3e35cd32291, obfs=wss, obfs-host=www.apple.com, obfs-uri=/ws, udp-relay=true, tag=US VMess 01
vless=us-vless-01.example.invalid:443, method=none, password=23ad6b10-8d1a-40f7-8ad0-e3e35cd32291, obfs=over-tls, obfs-host=www.apple.com, udp-relay=true, tag=US VLESS 01
trojan=us-trojan-01.example.invalid:443, password=placeholder, over-tls=true, tls-host=www.apple.com, tls-verification=true, udp-relay=true, tag=US Trojan 01
http=helper.example.invalid:443, username=demo, password=placeholder, over-tls=true, tls-host=www.apple.com, tls-verification=true, tag=Helper HTTP 01
socks5=helper.example.invalid:1080, username=demo, password=placeholder, tag=Helper SOCKS5 01

; Unsupported protocol line. Dropped even though it has a tag.
hysteria2=edge.example.invalid:443, password=placeholder, tag=HY2 Edge 01

[filter_local]
geoip, cn, direct
ip-cidr, 192.168.0.0/16, direct
final, Nexitally

[filter_remote]
; Keep personal filter lists in the local profile, not in this sample.

[rewrite_remote]
; Keep personal rewrite lists in the local profile, not in this sample.
