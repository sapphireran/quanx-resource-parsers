# Sanitized stand-in for a Nexitally-style full Quantumult X configuration.
# Hosts, passwords, and URLs are from the official Quantumult X sample.conf
# or RFC documentation prefixes. This is not a subscription and will not connect.

[general]
server_check_url = http://www.apple.com/generate_204
; resource_parser_url is set in the *local* profile, not in the provider file.

[dns]
no-ipv6
server = 223.5.5.5

[policy]
static = PROXY, HK-01, JP-01, SG-01, direct
available = AUTO, HK-01, JP-01, SG-01

[server_remote]
https://example.invalid/other.snippet, tag=Other, enabled=false

[filter_remote]
https://raw.githubusercontent.com/crossutility/Quantumult-X/master/filter.snippet, tag=Sample, enabled=false

[rewrite_remote]
https://raw.githubusercontent.com/crossutility/Quantumult-X/master/sample-import-rewrite.snippet, tag=Sample, enabled=false

[server_local]
; Provider dashboard rows — not connectable.
shadowsocks=127.0.0.1:443, method=chacha20, password=pwd, tag=Traffic: 88.0 GB
shadowsocks=127.0.0.1:443, method=chacha20, password=pwd, tag=Expire: 2099-01-01
shadowsocks=127.0.0.1:443, method=chacha20, password=pwd, tag=Reset: 7 Days Left
shadowsocks=127.0.0.1:443, method=chacha20, password=pwd, tag=流量: 88.0 GB
shadowsocks=127.0.0.1:443, method=chacha20, password=pwd, tag=套餐到期 2099-01-01
shadowsocks=127.0.0.1:443, method=chacha20, password=pwd, tag=剩余 12 天

; Comments in all three Quantumult X styles.
# hash comment
// slash comment

; Duplicate of HK-01 appears twice; parser keeps the first.
anytls=example.com:443, password=pwd, over-tls=true, tls-host=apple.com, udp-relay=true, tag=HK-01
anytls=example.com:443, password=pwd, over-tls=true, tls-host=apple.com, udp-relay=true, tag=HK-01

; Reserved slot, not a host.
anytls=example.com:8443, password=pwd, over-tls=true, tls-host=apple.com, udp-relay=true, tag=HK-01 [Premium]

; Official sample AnyTLS Reality line.
anytls=example.com:443, password=pwd, over-tls=true, tls-host=apple.com, reality-base64-pubkey=k4Uxez0sjl8bKaZH2Vgi8-WDFshML51QkxKFLWFIONk, reality-hex-shortid=0123456789abcdef, udp-relay=true, tag=JP-01

trojan=example.com:443, password=pwd, over-tls=true, tls-verification=true, tag=SG-01
vmess=example.com:443, method=none, password=23ad6b10-8d1a-40f7-8ad0-e3e35cd32291, obfs=over-tls, tag=US-01
vless=example.com:443, method=none, password=23ad6b10-8d1a-40f7-8ad0-e3e35cd32291, obfs=wss, obfs-uri=/ws, tag=US-02
http=example.com:443, username=name, password=pwd, over-tls=true, tls-host=example.com, tls-verification=true, tag=HTTP-01
socks5=example.com:80, username=name, password=pwd, tag=SOCKS-01
shadowsocks=example.com:80, method=chacha20, password=pwd, obfs=http, obfs-host=apple.com, tag=SS-01

; Unknown prefixes and URI schemes must not leak through.
hysteria2=example.com:443, password=pwd, tag=HY2-dropped
tuic=example.com:443, password=pwd, tag=TUIC-dropped
ss://YWVzLTI1Ni1nY206cHdk@example.com:443#dropped

[filter_local]
host, www.apple.com, direct
ip-cidr, 192.168.0.0/16, direct

[rewrite_local]

[mitm]
hostname = -www.example.com
