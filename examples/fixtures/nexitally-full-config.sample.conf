# Sanitized Nexitally-style Quantumult X full configuration.
# Hosts, passwords, and account fields are placeholders. Do not treat this as a live subscription.

[general]
profile_img_url = https://example.test/nexitally-profile.png
resource_parser_url = https://cdn.jsdelivr.net/gh/sapphireran/quanx-resource-parsers@main/nexitally-node-parser.js
server_check_url = http://www.apple.com/generate_204
server_check_timeout = 5000

[dns]
no-ipv6
server = 223.5.5.5
server = 119.29.29.29

[policy]
static = Nexitally, resource-tag-regex=^Nexitally, server-tag-regex=., img-url=https://example.test/nexitally.png
available = Nexitally-Auto, resource-tag-regex=^Nexitally, server-tag-regex=^(HK|JP|SG)

[server_remote]
# The live private URL belongs only in a local Quantumult X profile.
# https://private.example.test/quantumultx/full.conf, tag=Nexitally, opt-parser=true, update-interval=21600, enabled=true

[filter_remote]
# Keep your own filter resources. This sample only shows that they sit outside [server_local].

[server_local]
# Account metadata that must never become a server resource.
shadowsocks=info.example.test:443, method=aes-128-gcm, password=placeholder, tag=Traffic: 128.50 GB / 500 GB
shadowsocks=info.example.test:443, method=aes-128-gcm, password=placeholder, tag=Expire: 2099-12-31
shadowsocks=info.example.test:443, method=aes-128-gcm, password=placeholder, tag=Reset: 7 Days Left
shadowsocks=info.example.test:443, method=aes-128-gcm, password=placeholder, tag=剩余流量 128.50 GB
shadowsocks=info.example.test:443, method=aes-128-gcm, password=placeholder, tag=套餐到期 2099-12-31
anytls=unused.example.test:443, password=unused, over-tls=true, tls-host=unused.example.test, udp-relay=true, tag=[Premium] Reserved Slot

# Usable AnyTLS nodes.
anytls=hk-01.example.test:443, password=example-password-hk01, over-tls=true, tls-host=cdn.example.test, udp-relay=true, tag=HK-01 AnyTLS
anytls=hk-02.example.test:443, password=example-password-hk02, over-tls=true, tls-host=cdn.example.test, udp-relay=true, tag=HK-02 AnyTLS
anytls=jp-01.example.test:443, password=example-password-jp01, over-tls=true, tls-host=cdn.example.test, udp-relay=true, tag=JP-01 AnyTLS
anytls=sg-01.example.test:443, password=example-password-sg01, over-tls=true, tls-host=cdn.example.test, reality-base64-pubkey=k4Uxez0sjl8bKaZH2Vgi8-WDFshML51QkxKFLWFIONk, reality-hex-shortid=0123456789abcdef, udp-relay=true, tag=SG-01 AnyTLS Reality

# Duplicate of HK-01 should be dropped.
anytls=hk-01.example.test:443, password=example-password-hk01, over-tls=true, tls-host=cdn.example.test, udp-relay=true, tag=HK-01 AnyTLS

[filter_local]
geoip, cn, direct
final, Nexitally

[mitm]
;hostname = *.example.test
