[general]
server_check_url = http://www.apple.com/generate_204

[dns]
server = 1.1.1.1

[policy]
static = Proxy, EDGE-01, img-url=https://example.com/proxy.png

[filter_remote]
https://example.com/filter.txt, tag=ExampleFilter, enabled=true

[server_local]
anytls = edge-01.nodes.example.test:443, password=example-password, over-tls=true, tls-host=www.apple.com, udp-relay=true, tag=EDGE-01
anytls = edge-02.nodes.example.test:443, password=example-password, over-tls=true, tls-host=www.apple.com, udp-relay=true, tag=EDGE-02

[filter_local]
# This line looks a bit like a server entry but must stay in [filter_local].
host, edge-01.nodes.example.test, Proxy
final, Proxy

[server_remote]
https://example.test/unused, tag=Unused, enabled=false
