# Fictional Nexitally-style managed Quantumult X profile.
# Hosts, passwords, and tags are placeholders. Do not treat this as a live subscription.

[general]
profile_img_url = https://example.com/avatar.png
resource_parser_url = https://cdn.jsdelivr.net/gh/sapphireran/quanx-resource-parsers@main/nexitally-node-parser.js
server_check_url = http://www.apple.com/generate_204
dns_exclusion_list = *.example.test

[dns]
no-ipv6
server = 1.1.1.1
server = 8.8.8.8
server = /example.test/1.1.1.1

[policy]
static = Proxy, HK-01, JP-01, SG-01, img-url=https://example.com/proxy.png
static = Final, Proxy, direct, img-url=https://example.com/final.png

[server_local]
; Traffic: 128.00 GB / 500.00 GB
; Expire: 2099-12-31
; Days Left: 999
; Reset: 2099-01-01
; 流量: 128 GB
; 到期: 2099-12-31
; 剩余: 999 天
; 套餐: Example Plan
anytls = hk-01.nodes.example.test:443, password=example-password, over-tls=true, tls-host=www.apple.com, udp-relay=true, tag=HK-01
anytls = jp-01.nodes.example.test:443, password=example-password, over-tls=true, tls-host=www.apple.com, udp-relay=true, tag=JP-01
anytls = sg-01.nodes.example.test:443, password=example-password, over-tls=true, tls-host=www.apple.com, udp-relay=true, tag=SG-01
anytls = us-01.nodes.example.test:443, password=example-password, over-tls=true, tls-host=www.apple.com, udp-relay=true, tag=US-01 [Premium]
anytls = hk-01.nodes.example.test:443, password=example-password, over-tls=true, tls-host=www.apple.com, udp-relay=true, tag=HK-01
shadowsocks = ss-01.nodes.example.test:8388, method=2022-blake3-aes-128-gcm, password=ZXhhbXBsZS1zczIwMjItc2VjcmV0, udp-relay=true, tag=SS-HK-01
# leftover from an editor
;anytls = dead.nodes.example.test:443, password=unused-example-secret, over-tls=true, tag=DEAD
// leftover slash comment
vmess = vmess-01.nodes.example.test:80, method=aes-128-gcm, password=00000000-0000-4000-8000-000000000001, fast-open=false, udp-relay=false, tag=VMESS-01

[filter_local]
host, example.test, direct
geoip, cn, direct
final, Proxy

[filter_remote]
https://example.com/filter.txt, tag=ExampleFilter, enabled=true

[server_remote]
https://example.test/unused, tag=Unused, enabled=false

[rewrite_local]
^https://example\.test/ping url reject

[mitm]
hostname = -*.example.test
