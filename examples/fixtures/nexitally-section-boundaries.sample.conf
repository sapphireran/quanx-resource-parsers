# Focused fixture: nodes after the next INI section must not leak into the result.

[server_local]
anytls=keep.example.test:443, password=keep, over-tls=true, tls-host=keep.example.test, udp-relay=true, tag=KEEP-BEFORE-BOUNDARY

[policy]
anytls=leak.example.test:443, password=leak, over-tls=true, tls-host=leak.example.test, udp-relay=true, tag=MUST-NOT-LEAK

[filter_local]
anytls=also-leak.example.test:443, password=leak, over-tls=true, tag=MUST-NOT-LEAK-EITHER
final, KEEP-BEFORE-BOUNDARY
