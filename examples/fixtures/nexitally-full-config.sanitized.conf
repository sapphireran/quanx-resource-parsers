# Sanitized stand-in for a Nexitally-managed full Quantumult X configuration.
# Hosts, passwords, and policy names are fake. Do not treat this as a live profile.

[general]
profile_img_url = https://example.com/icons/nexitally-demo.png
resource_parser_url = https://raw.githubusercontent.com/sapphireran/quanx-resource-parsers/main/nexitally-node-parser.js
server_check_url = http://www.apple.com/generate_204
server_check_timeout = 5000
dns_exclusion_list = *.cmpassport.com, *.jegotrip.com.cn
geo_location_checker = http://ip-api.com/json/?lang=zh-CN, https://example.com/geo.js

[dns]
no-ipv6
server = 223.5.5.5
server = 119.29.29.29
doh-server = https://dns.alidns.com/dns-query

[policy]
static = Nexitally, resource-tag-regex=^Nexitally, img-url=https://example.com/icons/nexitally-demo.png
static = Proxy, Nexitally, direct, reject
static = Final, Proxy, direct

[server_remote]
# Intentionally empty in the managed full profile. Nodes live in [server_local].

[server_local]
; Provider metadata. These must not become nodes.
# Traffic: 128.50 GB / 500.00 GB
# Expire: 2099-12-31
# Days Left: 999
; 流量：128.50 GB
; 到期：2099-12-31
; 剩余：999 天
; 套餐：Demo Plan

anytls = info.nodes.example.com:1, password=0, over-tls=true, tag=Traffic: 128.50 GB / 500.00 GB
anytls = info.nodes.example.com:1, password=0, over-tls=true, tag=Expire: 2099-12-31
anytls = info.nodes.example.com:1, password=0, over-tls=true, tag=流量剩余 371.50 GB
anytls = info.nodes.example.com:1, password=0, over-tls=true, tag=套餐重置 Reset: 2099-01-01

; Usable AnyTLS nodes (standard TLS and Reality).
anytls = hk-01.nodes.example.com:443, password=example-password-not-real, over-tls=true, tls-host=hk-01.nodes.example.com, udp-relay=true, tag=HK-01
anytls = jp-01.nodes.example.com:443, password=example-password-not-real, over-tls=true, tls-host=jp-01.nodes.example.com, udp-relay=true, tag=JP-01
anytls = sg-01.nodes.example.com:443, password=example-password-not-real, over-tls=true, tls-host=sg-01.nodes.example.com, reality-base64-pubkey=k4Uxez0sjl8bKaZH2Vgi8-WDFshML51QkxKFLWFIONk, reality-hex-shortid=0123456789abcdef, udp-relay=true, tag=SG-01

; Exact duplicate of HK-01 — parser must keep the first copy only.
anytls = hk-01.nodes.example.com:443, password=example-password-not-real, over-tls=true, tls-host=hk-01.nodes.example.com, udp-relay=true, tag=HK-01

; Placeholder the provider uses for locked inventory.
anytls = premium.nodes.example.com:443, password=example-password-not-real, over-tls=true, tls-host=premium.nodes.example.com, udp-relay=true, tag=JP-02 [Premium]

; Other Quantumult X server families that still belong in a server resource.
shadowsocks = us-01.nodes.example.com:443, method=2022-blake3-aes-128-gcm, password=BJDBGeLKx/JbEACCSN5rRg==, obfs=over-tls, obfs-host=us-01.nodes.example.com, tls-verification=true, udp-relay=true, tag=US-01
trojan = de-01.nodes.example.com:443, password=example-password-not-real, over-tls=true, tls-host=de-01.nodes.example.com, tls-verification=true, udp-relay=true, tag=DE-01
vmess = tw-01.nodes.example.com:443, method=chacha20-poly1305, password=23ad6b10-8d1a-40f7-8ad0-e3e35cd32291, obfs=wss, obfs-host=tw-01.nodes.example.com, obfs-uri=/example, udp-relay=true, tag=TW-01
vless = kr-01.nodes.example.com:443, method=none, password=23ad6b10-8d1a-40f7-8ad0-e3e35cd32291, obfs=over-tls, obfs-host=kr-01.nodes.example.com, udp-relay=true, tag=KR-01

; Spaces around "=" are valid Quantumult X syntax.
ANYTLS = au-01.nodes.example.com:443, password=example-password-not-real, over-tls=true, tls-host=au-01.nodes.example.com, udp-relay=true, tag=AU-01

[filter_remote]
https://example.com/filters/apple.list, tag=Apple, force-policy=direct, enabled=true
https://example.com/filters/cn.list, tag=CN, force-policy=direct, enabled=true

[filter_local]
host-suffix, apple.com, direct
host-suffix, icloud.com, direct
ip-cidr, 10.0.0.0/8, direct
ip-cidr, 172.16.0.0/12, direct
ip-cidr, 192.168.0.0/16, direct
geoip, cn, direct
final, Final

[rewrite_local]
; Managed full profiles often ship rewrite rules. A server parser must not leak them.
^https://example\.com/advert url reject-200

[mitm]
; hostname = example.com
