# Exact-line duplicates collapse. Comments never become servers.
# Two lines that share a tag but differ elsewhere both survive.

[server_local]
; leading comment
# another comment
// third comment

anytls=example.com:443, password=pwd, over-tls=true, tls-host=apple.com, udp-relay=true, tag=same-tag
anytls=example.com:443, password=pwd, over-tls=true, tls-host=apple.com, udp-relay=false, tag=same-tag
anytls=example.com:443, password=pwd, over-tls=true, tls-host=apple.com, udp-relay=true, tag=same-tag

   trojan=example.com:443, password=pwd, over-tls=true, tls-verification=true, tag=padded
trojan=example.com:443, password=pwd, over-tls=true, tls-verification=true, tag=padded

[policy]
static = IGNORE-ME, same-tag, direct
