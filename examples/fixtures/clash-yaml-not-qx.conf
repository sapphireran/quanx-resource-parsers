# Clash-shaped input. The Nexitally parser must not scrape "type: ss" rows
# out of YAML. Quantumult X would only reach this parser if someone pointed
# a Clash URL at it by mistake.

proxies:
  - name: HK-01
    type: ss
    server: example.com
    port: 443
    cipher: chacha20-ietf-poly1305
    password: pwd
  - name: JP-01
    type: trojan
    server: example.com
    port: 443
    password: pwd

proxy-groups:
  - name: PROXY
    type: select
    proxies: [HK-01, JP-01]
