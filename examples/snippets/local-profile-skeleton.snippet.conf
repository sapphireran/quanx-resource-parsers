# Minimal local Quantumult X skeleton that keeps filters and policies stable
# while Nexitally nodes refresh through [server_remote] + this parser.
#
# Replace the private URL. Leave every other section as your own working profile.

[general]
resource_parser_url = https://cdn.jsdelivr.net/gh/sapphireran/quanx-resource-parsers@main/nexitally-node-parser.js
server_check_url = http://www.apple.com/generate_204
server_check_timeout = 5000

[dns]
no-ipv6
server = 223.5.5.5
server = 119.29.29.29

[policy]
static = Nexitally, resource-tag-regex=^Nexitally, server-tag-regex=.
available = Nexitally-Auto, resource-tag-regex=^Nexitally, server-tag-regex=.
static = Final, Nexitally-Auto, Nexitally, direct

[server_remote]
<YOUR_PRIVATE_NEXITALLY_QUANTUMULT_X_URL>, tag=Nexitally, opt-parser=true, update-interval=21600, enabled=true

[filter_remote]
# Keep your existing filter resources here.

[server_local]
# Keep only personal extra nodes here. Do not paste the Nexitally full config.

[filter_local]
geoip, cn, direct
final, Final

[rewrite_local]
# Keep your existing rewrite rules here.

[mitm]
# Keep your existing MITM settings here. Never publish passphrase or p12 data.
