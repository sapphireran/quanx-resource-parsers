# Optional local policies that select only servers produced by the Nexitally resource.
# resource-tag-regex matches the [server_remote] tag, not the individual node tag.

[policy]
static = Nexitally, resource-tag-regex=^Nexitally, server-tag-regex=., img-url=https://example.test/nexitally.png
available = Nexitally-Auto, resource-tag-regex=^Nexitally, server-tag-regex=.
url-latency-benchmark = Nexitally-Bench, resource-tag-regex=^Nexitally, server-tag-regex=., check-interval=600, alive-checking=false, tolerance=50
static = Nexitally-HK, resource-tag-regex=^Nexitally, server-tag-regex=^(HK|Hong Kong|香港)
static = Nexitally-JP, resource-tag-regex=^Nexitally, server-tag-regex=^(JP|Japan|日本)
static = Nexitally-SG, resource-tag-regex=^Nexitally, server-tag-regex=^(SG|Singapore|新加坡)
