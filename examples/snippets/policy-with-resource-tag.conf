# Personal [policy] fragment.
# Nexitally's downloaded policy section is discarded by the parser.
# Select refreshed nodes by the server-resource tag instead.

[policy]
static = Nexitally, resource-tag-regex=^Nexitally
available = Nexitally-Auto, resource-tag-regex=^Nexitally
url-latency-benchmark = Nexitally-Bench, resource-tag-regex=^Nexitally, check-interval=600, alive-checking=false, tolerance=0
