# Personal Quantumult X skeleton.
# This is not a Nexitally download. Fill in the private URL on the device only.
# Filters and rewrites stay local; only the Nexitally server resource is parsed.

[general]
resource_parser_url = https://raw.githubusercontent.com/sapphireran/quanx-resource-parsers/main/nexitally-node-parser.js
server_check_url = http://www.apple.com/generate_204

[dns]
server = 223.5.5.5
no-ipv6

[policy]
static = Nexitally, resource-tag-regex=^Nexitally
static = Final, Nexitally, direct

[server_remote]
<YOUR_PRIVATE_NEXITALLY_QUANTUMULT_X_URL>, tag=Nexitally, opt-parser=true, update-interval=21600, enabled=true

[server_local]
; local-only nodes, if any — these are not produced by the parser

[filter_remote]
; keep your own filter lists here

[filter_local]
host-suffix, apple.com, direct
final, Final

[rewrite_remote]
; keep your own rewrite lists here

[mitm]
; hostname = *.example.com
