# Personal Quantumult X fragment — not a full profile.
# Replace the placeholder URL only on the device. Never commit the real one.

[general]
resource_parser_url = https://raw.githubusercontent.com/sapphireran/quanx-resource-parsers/main/nexitally-node-parser.js
server_check_url = http://www.apple.com/generate_204

[policy]
# Keep your own group names. The parser does not emit [policy].
static = PROXY, resource-tag-regex=^Nexitally, server-tag-regex=^.*, img-url=https://raw.githubusercontent.com/crossutility/Quantumult-X/master/quantumult-x.png
static = DIRECT, direct

[server_remote]
<YOUR_PRIVATE_NEXITALLY_QUANTUMULT_X_URL>, tag=Nexitally, opt-parser=true, update-interval=21600, enabled=true

[filter_local]
# Whatever you already use. A node refresh must not rewrite this section.
geoip, cn, DIRECT
final, PROXY
