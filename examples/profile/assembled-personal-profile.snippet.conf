# Assembled personal Quantumult X fragment (synthetic).
# This is what should remain on the device after the one-time import of a
# stable profile. Nodes come from the parsed server resource, not from a
# provider [server_local] block pasted into this file.

[general]
resource_parser_url = https://raw.githubusercontent.com/sapphireran/quanx-resource-parsers/main/nexitally-node-parser.js
server_check_url = http://www.apple.com/generate_204

[dns]
no-ipv6
server = 223.5.5.5

[policy]
static = Nexitally, resource-tag-regex=^Nexitally$, img-url=https://example.test/icon.png
static = Proxy, Nexitally, DIRECT
url-latency-benchmark = Nexitally-Auto, resource-tag-regex=^Nexitally$, check-interval=600, alive-checking=false, tolerance=50
static = Final, Proxy, DIRECT

[server_remote]
<YOUR_PRIVATE_NEXITALLY_QUANTUMULT_X_URL>, tag=Nexitally, opt-parser=true, update-interval=21600, enabled=true

[filter_local]
host-suffix, apple.com, direct
host-suffix, icloud.com, direct
final, Final

[rewrite_local]

[mitm]
passphrase =
skip_validating_cert = false
