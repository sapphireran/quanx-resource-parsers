# Personal Quantumult X snippet — paste into an existing profile.
# Replace the placeholder URL. Never commit a real subscription URL.

[general]
# Prefer GitHub raw while changing the parser; jsDelivr is fine day-to-day.
resource_parser_url = https://raw.githubusercontent.com/sapphireran/quanx-resource-parsers/main/nexitally-node-parser.js

[server_remote]
<YOUR_PRIVATE_NEXITALLY_QUANTUMULT_X_URL>, tag=Nexitally, opt-parser=true, update-interval=21600, enabled=true

# Optional: select imported nodes by the resource tag above.
[policy]
static = Proxy, resource-tag-regex=^Nexitally, direct
static = Final, Proxy, direct
