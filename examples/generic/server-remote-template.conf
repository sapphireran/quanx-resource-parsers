# Generic personal skeleton for a Quantumult X profile that consumes
# one parsed server resource. Swap the parser URL and the private
# resource URL. Do not commit the private URL.

[general]
resource_parser_url = https://raw.githubusercontent.com/sapphireran/quanx-resource-parsers/main/nexitally-node-parser.js
server_check_url = http://www.apple.com/generate_204

[server_remote]
<YOUR_PRIVATE_SERVER_RESOURCE_URL>, tag=Personal, opt-parser=true, update-interval=21600, enabled=true

[policy]
static = Personal, resource-tag-regex=^Personal
available = Personal-Auto, resource-tag-regex=^Personal
static = Proxy, Personal, Personal-Auto, direct

[filter_local]
geoip, cn, direct
final, Proxy
