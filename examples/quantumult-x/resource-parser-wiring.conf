# Wiring the personal parser into [general] and [server_remote]
#
# resource_parser_url is global. opt-parser=true is per resource.
# update-interval=21600 is six hours.

[general]
resource_parser_url = https://cdn.jsdelivr.net/gh/sapphireran/quanx-resource-parsers@main/nexitally-node-parser.js
; Alternative without a CDN:
;resource_parser_url = https://raw.githubusercontent.com/sapphireran/quanx-resource-parsers/main/nexitally-node-parser.js
server_check_url = http://www.apple.com/generate_204
server_check_timeout = 5000

[server_remote]
# Keep the real Nexitally URL only on the device.
<YOUR_PRIVATE_NEXITALLY_QUANTUMULT_X_URL>, tag=Nexitally, opt-parser=true, update-interval=21600, enabled=true

# A second resource that is *already* Quantumult X server lines should leave
# the parser off, otherwise this Nexitally extractor will error on a missing
# [server_local] section.
https://raw.githubusercontent.com/crossutility/Quantumult-X/master/server.snippet, tag=Official-Sample, opt-parser=false, enabled=false
