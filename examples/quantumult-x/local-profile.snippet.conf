# Minimal local Quantumult X profile that uses the Nexitally parser.
# Copy the pieces you need. Replace the private URL token on your device only.
# This file is not a complete production profile.

[general]
resource_parser_url = https://cdn.jsdelivr.net/gh/sapphireran/quanx-resource-parsers@main/nexitally-node-parser.js
server_check_url = http://www.apple.com/generate_204
server_check_timeout = 5000

[dns]
no-ipv6
server = 223.5.5.5

[policy]
static = Proxy, resource-tag-regex=^Nexitally$, img-url=https://example.invalid/proxy.png
available = Auto, resource-tag-regex=^Nexitally$
static = Final, Proxy, direct

[server_remote]
<YOUR_PRIVATE_NEXITALLY_QUANTUMULT_X_URL>, tag=Nexitally, opt-parser=true, update-interval=21600, enabled=true

[server_local]
# Add personal nodes here if you have any. They are not touched when the
# Nexitally resource refreshes.

[filter_local]
geoip, cn, direct
final, Final

[mitm]
;hostname = -*.example.invalid
