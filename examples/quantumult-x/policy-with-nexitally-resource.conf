# Selecting parsed Nexitally nodes from local policy
#
# The parser returns server lines. It does not emit [policy].
# resource-tag-regex matches the tag= on the [server_remote] line.

[general]
resource_parser_url = https://cdn.jsdelivr.net/gh/sapphireran/quanx-resource-parsers@main/nexitally-node-parser.js

[server_remote]
<YOUR_PRIVATE_NEXITALLY_QUANTUMULT_X_URL>, tag=Nexitally, opt-parser=true, update-interval=21600, enabled=true

[policy]
# Manual pick from whatever the parser last imported
static = nexitally, resource-tag-regex=^Nexitally, img-url=https://example.com/icon.png

# Lowest URL latency among imported nodes
url-latency-benchmark = nexitally-auto, resource-tag-regex=^Nexitally, check-interval=600, alive-checking=false, tolerance=50

# Optional: only names that start with HK- / JP-
static = nexitally-asia, resource-tag-regex=^Nexitally, server-tag-regex=^(HK|JP|SG)-, img-url=https://example.com/icon.png

ssid = nexitally-ssid, nexitally-auto, LINK_EXAMPLE:direct
