# Minimal local Quantumult X profile that uses the Nexitally parser.
# This is a snippet for reading, not a complete production profile.
#
# After import:
# 1. Replace YOUR_PRIVATE_NEXITALLY_QUANTUMULT_X_URL with the private
#    Configuration File URL from the Nexitally dashboard.
# 2. Refresh Server Resources → Nexitally.
# 3. Leave [filter_remote] / [rewrite_remote] as your own stable lists.

[general]
resource_parser_url = https://cdn.jsdelivr.net/gh/sapphireran/quanx-resource-parsers@main/nexitally-node-parser.js
server_check_url = http://www.apple.com/generate_204

[dns]
no-ipv6
server = 223.5.5.5

[policy]
static = Nexitally, resource-tag-regex=^Nexitally
static = Proxy, Nexitally, direct
static = Final, Proxy, direct

[server_remote]
YOUR_PRIVATE_NEXITALLY_QUANTUMULT_X_URL, tag=Nexitally, opt-parser=true, update-interval=21600, enabled=true

[server_local]
; Local-only nodes stay here. The parser never writes this section.

[filter_remote]
; Keep your existing rule sets. Re-downloading Nexitally's full file
; would have replaced this section; the parser path does not.

[filter_local]
final, Final

[rewrite_local]

[mitm]
