# Local [server_remote] fragment.
# Quantumult X downloads YOUR private Nexitally full-configuration URL,
# then runs the parser registered in [general].
#
# Keep the real URL only on the device. Never commit it.

[server_remote]
YOUR_PRIVATE_NEXITALLY_QUANTUMULT_X_URL, tag=Nexitally, opt-parser=true, update-interval=21600, enabled=true
