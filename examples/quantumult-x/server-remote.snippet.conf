# Paste into [server_remote] of your local Quantumult X profile.
# Keep the Nexitally URL only on your device. The token below is not a URL.

[server_remote]
<YOUR_PRIVATE_NEXITALLY_QUANTUMULT_X_URL>, tag=Nexitally, opt-parser=true, update-interval=21600, enabled=true

# Notes:
# - opt-parser=true is required. Without it Quantumult X imports the full
#   configuration as if it were a server list and the parse step never runs.
# - update-interval is seconds. 21600 = 6 hours.
# - tag=Nexitally is what [policy] resource-tag-regex can match later.
# - Do not put this URL in a public Gist, this repository, or a screenshot.
