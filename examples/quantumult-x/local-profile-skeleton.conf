# Minimal local Quantumult X profile that uses nexitally-node-parser.js.
#
# PERSONAL / DOCUMENTATION ONLY.
# - Replace <YOUR_PRIVATE_NEXITALLY_QUANTUMULT_X_URL>.
# - Do not commit a filled-in copy.
# - Filters here are a stub (geoip + final). Use your own filter_remote lists.
#
# Compatible with Quantumult X 1.5.6+ (AnyTLS). See docs/nexitally-workflow.md.

[general]
profile_img_url = https://example.com/icons/nexitally.png
resource_parser_url = https://cdn.jsdelivr.net/gh/sapphireran/quanx-resource-parsers@main/nexitally-node-parser.js
server_check_url = http://www.apple.com/generate_204
server_check_timeout = 5000

[dns]
server = 1.1.1.1
server = 8.8.8.8
no-ipv6

[policy]
static = Nexitally, resource-tag-regex=^Nexitally, img-url=https://example.com/icons/nexitally.png
static = Final, Nexitally, direct

[server_remote]
<YOUR_PRIVATE_NEXITALLY_QUANTUMULT_X_URL>, tag=Nexitally, opt-parser=true, update-interval=21600, enabled=true

[server_local]
# Intentionally empty. Nodes come from the parsed remote resource.

[filter_local]
geoip, cn, direct
final, Final

[filter_remote]
# Add your own rule sets. Do not import a vendor full-profile download here
# if the goal is to keep local control of filters.

[rewrite_local]

[rewrite_remote]

[mitm]
