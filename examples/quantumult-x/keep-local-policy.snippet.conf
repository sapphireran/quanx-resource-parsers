# Keep policy and filters in the local profile. The Nexitally parser only
# refreshes servers. If you re-download Nexitally's full configuration
# through Configuration File → Download, these sections get replaced.

[policy]
# resource-tag-regex pulls every server imported from tag=Nexitally.
static = Proxy, resource-tag-regex=^Nexitally$, img-url=https://example.invalid/proxy.png
available = Auto, resource-tag-regex=^Nexitally$
static = Apple, direct, Proxy
static = Final, Proxy, direct

[filter_remote]
; https://example.invalid/filter/apple.txt, tag=Apple, force-policy=Apple, enabled=true
; https://example.invalid/filter/reject.txt, tag=Reject, enabled=true

[filter_local]
geoip, cn, direct
final, Final
