# Keep filters and rewrites in the local profile
#
# Nexitally's managed download may include [filter_remote] and [rewrite_*]
# that you do not want. Because the parser stores only server lines on the
# Nexitally resource, these local sections survive a node refresh.

[general]
resource_parser_url = https://cdn.jsdelivr.net/gh/sapphireran/quanx-resource-parsers@main/nexitally-node-parser.js

[server_remote]
<YOUR_PRIVATE_NEXITALLY_QUANTUMULT_X_URL>, tag=Nexitally, opt-parser=true, update-interval=21600, enabled=true

[policy]
static = nexitally, resource-tag-regex=^Nexitally
static = PROXY, nexitally, direct

[filter_remote]
https://raw.githubusercontent.com/crossutility/Quantumult-X/master/filter.snippet, tag=Sample, enabled=false

[filter_local]
host-suffix, apple.com, direct
host-suffix, icloud.com, direct
host-suffix, example.test, nexitally
final, PROXY

[rewrite_local]
# Personal rewrite rules belong here, not in the provider's full config.
;^https://example.com/ads url reject

[mitm]
;hostname = *.example.test
