# Paste into the [general] section of your local Quantumult X profile.
# Quantumult X fetches this script and runs it against each resource that
# has opt-parser=true. HTTP APIs and persistent storage are not available
# inside a resource parser (see the official resource-parser.js comments).

[general]
resource_parser_url = https://cdn.jsdelivr.net/gh/sapphireran/quanx-resource-parsers@main/nexitally-node-parser.js

# Pin a commit if you do not want jsDelivr to follow main:
;resource_parser_url = https://cdn.jsdelivr.net/gh/sapphireran/quanx-resource-parsers@<commit-sha>/nexitally-node-parser.js

# Same file via GitHub raw, useful when jsDelivr is cached or blocked:
;resource_parser_url = https://raw.githubusercontent.com/sapphireran/quanx-resource-parsers/main/nexitally-node-parser.js
