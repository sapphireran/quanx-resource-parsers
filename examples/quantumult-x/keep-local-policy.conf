# Local [policy] fragment that keeps working after the parser rewrite.
# Nodes arrive from [server_remote] with tag=Nexitally on the *resource*,
# while each server still has its own per-node tag (HK-01, JP-01, ...).

[policy]
static = Nexitally, resource-tag-regex=^Nexitally, img-url=https://example.invalid/icon.png
available = Nexitally-Auto, resource-tag-regex=^Nexitally
url-latency-benchmark = Nexitally-Bench, resource-tag-regex=^Nexitally, check-interval=600, tolerance=50
static = Proxy, Nexitally, Nexitally-Auto, direct
