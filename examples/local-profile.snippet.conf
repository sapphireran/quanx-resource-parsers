# Local Quantumult X profile fragment.
# This is documentation, not a working subscription.
# Replace the placeholder URL in your own app. Never commit a real URL.

[general]
resource_parser_url = https://raw.githubusercontent.com/sapphireran/quanx-resource-parsers/main/nexitally-node-parser.js
server_check_url = http://www.apple.com/generate_204
server_check_timeout = 5000

# jsDelivr alternative when GitHub raw is unreachable:
# resource_parser_url = https://cdn.jsdelivr.net/gh/sapphireran/quanx-resource-parsers@main/nexitally-node-parser.js

[dns]
no-ipv6
server = 223.5.5.5
server = 119.29.29.29

[policy]
# Follow every node imported from the Nexitally server resource.
static = Nexitally, resource-tag-regex=^Nexitally, server-tag-regex=., img-url=https://raw.githubusercontent.com/crossutility/Quantumult-X/master/quantumult-x.png
# Region slice example: only tags that contain "HK".
static = Nexitally-HK, resource-tag-regex=^Nexitally, server-tag-regex=HK, img-url=https://raw.githubusercontent.com/crossutility/Quantumult-X/master/quantumult-x.png
static = PROXY, Nexitally, direct

[server_remote]
# opt-parser=true is required. Without it Quantumult X will not run the parser.
<YOUR_PRIVATE_NEXITALLY_QUANTUMULT_X_URL>, tag=Nexitally, opt-parser=true, update-interval=21600, enabled=true

[filter_remote]
# Keep your existing filter lists. Do not replace this section by
# downloading Nexitally's full configuration as a profile.
;https://raw.githubusercontent.com/crossutility/Quantumult-X/master/filter.snippet, tag=Sample, enabled=true

[filter_local]
geoip, cn, direct
final, PROXY

[rewrite_remote]
# Existing rewrite lists stay here.

[server_local]
# Local-only nodes, if any. The Nexitally list arrives through
# [server_remote], not through this section.

[mitm]
;passphrase =
;p12 =
