; Invented Nexitally-shaped Quantumult X full configuration.
; Hosts are *.example.invalid or official Quantumult X sample hosts.
; This is not a live download.

[general]
resource_parser_url = https://cdn.jsdelivr.net/gh/sapphireran/quanx-resource-parsers@main/nexitally-node-parser.js
server_check_url = http://www.apple.com/generate_204

[dns]
server = 223.5.5.5

[policy]
static = Nexitally, resource-tag-regex=^Nexitally, server-tag-regex=.*, img-url=https://example.com/icon.png

[server_local]
; region nodes
anytls=hk-01.example.invalid:443, password=pwd, over-tls=true, tls-host=apple.com, udp-relay=true, tag=HK-01
anytls=sg-01.example.invalid:443, password=pwd, over-tls=true, tls-host=apple.com, udp-relay=true, tag=SG-01
anytls=jp-01.example.invalid:443, password=pwd, over-tls=true, tls-host=apple.com, udp-relay=true, tag=JP-01
shadowsocks=example.com:80, method=chacha20, password=pwd, obfs=http, obfs-host=apple.com, tag=US-01

; exact duplicate of HK-01
anytls=hk-01.example.invalid:443, password=pwd, over-tls=true, tls-host=apple.com, udp-relay=true, tag=HK-01

; account banners that must never become servers
shadowsocks=info.example.invalid:80, method=none, password=pwd, tag=Traffic: 12.30 GB
shadowsocks=info.example.invalid:80, method=none, password=pwd, tag=Expire: 2099-12-31
shadowsocks=info.example.invalid:80, method=none, password=pwd, tag=流量: 12.30 GB
anytls=placeholder.example.invalid:443, password=pwd, over-tls=true, tls-host=apple.com, tag=[Premium]

[filter_local]
host-suffix, example.invalid, proxy
final, proxy

[rewrite_local]
