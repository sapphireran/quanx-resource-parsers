; Server-shaped lines outside [server_local] must not leak into $done.

[general]
resource_parser_url = https://raw.githubusercontent.com/sapphireran/quanx-resource-parsers/main/nexitally-node-parser.js

[policy]
static = Nexitally, resource-tag-regex=^Nexitally, server-tag-regex=.*

anytls=policy-leak.example.invalid:443, password=pwd, over-tls=true, tls-host=apple.com, tag=LEAK-POLICY

[server_local]
anytls=hk-01.example.invalid:443, password=pwd, over-tls=true, tls-host=apple.com, tag=HK-01

[filter_local]
anytls=filter-leak.example.invalid:443, password=pwd, over-tls=true, tls-host=apple.com, tag=LEAK-FILTER
final, proxy

[server_remote]
anytls=remote-leak.example.invalid:443, password=pwd, over-tls=true, tls-host=apple.com, tag=LEAK-REMOTE
