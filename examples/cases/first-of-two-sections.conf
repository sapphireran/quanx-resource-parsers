; The regex is not global. The first [server_local] wins.

[server_local]
anytls=first.example.invalid:443, password=pwd, over-tls=true, tls-host=apple.com, tag=FIRST-01

[policy]
static = Nexitally, resource-tag-regex=^Nexitally, server-tag-regex=.*

[server_local]
anytls=second.example.invalid:443, password=pwd, over-tls=true, tls-host=apple.com, tag=SECOND-01
