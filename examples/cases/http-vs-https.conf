; http= is supported. https= is not: the prefix regex needs whitespace-or-equals after "http".

[server_local]
http=example.com:80, username=name, password=pwd, tag=http-02
https=example.com:443, username=name, password=pwd, over-tls=true, tag=https-01
socks5=example.com:80, username=name, password=pwd, tag=socks5-02
socks=example.com:80, username=name, password=pwd, tag=socks-01
ss=example.com:80, method=chacha20, password=pwd, tag=ss-short
shadowsocks=example.com:80, method=chacha20, password=pwd, tag=ss-obfs-http-01

