; Prefixes Quantumult X may understand elsewhere, but this parser does not keep.

[server_local]
hysteria2=example.com:443, password=pwd, tag=HY2-01
tuic=example.com:443, password=pwd, tag=TUIC-01
wireguard=example.com:51820, tag=WG-01
ss=example.com:80, method=chacha20, password=pwd, tag=SS-SHORT
socks=example.com:80, username=name, password=pwd, tag=SOCKS4
https=example.com:443, username=name, password=pwd, tag=HTTPS-01

[filter_local]
final, proxy
