# Policies that select every server delivered by the Nexitally resource.
# resource-tag-regex matches the [server_remote] tag, not each node name.

[policy]
static = Nexitally, resource-tag-regex=^Nexitally, img-url=https://example.com/icon.png
available = Nexitally-Available, resource-tag-regex=^Nexitally, img-url=https://example.com/icon.png
url-latency-benchmark = Nexitally-Benchmark, resource-tag-regex=^Nexitally, check-interval=600, alive-checking=false, tolerance=0, img-url=https://example.com/icon.png

# Example of wrapping the Nexitally group in a broader proxy choice.
static = Proxy, Nexitally, DIRECT

# server-tag-regex is different: it matches individual node tags after parse.
# Use it when you want a region slice of the same resource, for example:
;static = Nexitally-HK, resource-tag-regex=^Nexitally, server-tag-regex=HK
;static = Nexitally-JP, resource-tag-regex=^Nexitally, server-tag-regex=JP
