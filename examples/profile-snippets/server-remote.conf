# [server_remote] is where Quantumult X downloads a resource and, when
# opt-parser=true, runs resource_parser_url against the response body.
#
# Replace the placeholder with the private Nexitally
# Configuration File → Download URL. Never commit that URL.

[server_remote]
<YOUR_PRIVATE_NEXITALLY_QUANTUMULT_X_URL>, tag=Nexitally, opt-parser=true, update-interval=21600, enabled=true

# Useful flags, all optional:
#   tag=Nexitally          name shown in Server Resources; policies can match it
#   opt-parser=true        run the [general] resource parser on this resource
#   update-interval=21600  refresh every 6 hours (seconds)
#   enabled=true           keep the resource active
#
# After the parser succeeds, Quantumult X stores the returned server lines
# under this resource. [policy], [filter_remote], and the rest of your
# local profile are left alone.
