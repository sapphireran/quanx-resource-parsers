# Personal Quantumult X snippet showing how this parser is wired.
#
# Copy the two marked blocks into your existing profile. Keep the Nexitally
# Configuration File URL only on the device. Never paste a real URL here.

[general]
# Block A — point Quantumult X at this repository's parser.
# jsDelivr and raw.githubusercontent.com are both fine; pick one.
resource_parser_url = https://raw.githubusercontent.com/sapphireran/quanx-resource-parsers/main/nexitally-node-parser.js
;resource_parser_url = https://cdn.jsdelivr.net/gh/sapphireran/quanx-resource-parsers@main/nexitally-node-parser.js

# Optional: store the script under iCloud / On My iPhone and use a local path
# instead of a URL. Quantumult X resolves local parsers from its Scripts folder.
;resource_parser_url = nexitally-node-parser.js

[dns]
# Keep your existing DNS. The managed Nexitally full profile also ships [dns];
# using [server_remote] + this parser means that remote [dns] is discarded.

[policy]
# Keep your existing policy groups. A typical personal setup references the
# server resource by tag instead of listing every node:
static = Nexitally, resource-tag-regex=^Nexitally, img-url=https://example.com/icons/nexitally-demo.png
static = Proxy, Nexitally, direct
static = Final, Proxy, direct

[server_remote]
# Block B — the private Nexitally Configuration File URL.
# Quantumult X downloads it, runs the parser, and treats the result as servers.
#
# Replace the placeholder with the URL from Nexitally → Configuration File →
# Download (Quantumult X). Do not commit the real URL.
https://example.com/replace-with-private-nexitally-quantumult-x-url, tag=Nexitally, opt-parser=true, update-interval=21600, enabled=true

# Other personal server resources can sit next to it and are untouched.
;https://example.com/other-servers.snippet, tag=Other, enabled=true

[filter_remote]
# Keep your existing remote filters. Re-downloading Nexitally's full profile
# would replace these; a server resource will not.

[filter_local]
# Keep your existing local filters.
;host-suffix, apple.com, direct
;geoip, cn, direct
;final, Final

[rewrite_remote]
# Keep your existing rewrite resources.

[rewrite_local]
# Keep your existing local rewrite rules.

[server_local]
# Optional personal nodes that are not part of the Nexitally resource.
;anytls = home.example.com:443, password=example-password-not-real, over-tls=true, tag=Home-Lab
