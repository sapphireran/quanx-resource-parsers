# Typical Nexitally-style Quantumult X full configuration (FAKE).
# This is what Configuration File → Download looks like: a complete profile,
# not a server-only subscription. Hosts and secrets are placeholders.

[general]
profile_img_url = https://example.invalid/nexitally.png
server_check_url = http://www.apple.com/generate_204
server_check_timeout = 5000

[dns]
no-ipv6
server = 223.5.5.5
server = 119.29.29.29

[policy]
static = Proxy, 香港 01, 东京 01, 新加坡 01, direct, img-url=https://example.invalid/proxy.png
available = Auto, 香港 01, 东京 01, 新加坡 01
static = Final, Proxy, direct

[server_local]
# Traffic: 128.50 GB / 500 GB
# Expire: 2026-12-31
# Reset: 7 Days Left

anytls=hk-01.example.invalid:443, password=example-password, over-tls=true, tls-host=www.apple.com, udp-relay=true, tag=香港 01
anytls=jp-01.example.invalid:443, password=example-password, over-tls=true, tls-host=www.apple.com, udp-relay=true, tag=东京 01
anytls=sg-01.example.invalid:443, password=example-password, over-tls=true, tls-host=www.apple.com, udp-relay=true, tag=新加坡 01
anytls=us-01.example.invalid:443, password=example-password, over-tls=true, tls-host=www.apple.com, udp-relay=true, tag=洛杉矶 [Premium]
anytls=hk-01.example.invalid:443, password=example-password, over-tls=true, tls-host=www.apple.com, udp-relay=true, tag=香港 01

[filter_remote]
https://example.invalid/filter/apple.txt, tag=Apple, force-policy=direct, enabled=true
https://example.invalid/filter/reject.txt, tag=Reject, enabled=true

[filter_local]
host-suffix, example.invalid, direct
geoip, cn, direct
final, Proxy

[rewrite_remote]
https://example.invalid/rewrite/cookie.conf, tag=Cookie, enabled=false

[server_remote]

[mitm]
;hostname = *.example.invalid
