# Local Quantumult X profile snippet (personal device only)
#
# Import this shape into a stable local profile. Do not use Nexitally's
# "download configuration" as the active profile.
#
# Replace <YOUR_PRIVATE_NEXITALLY_QUANTUMULT_X_URL> on the device.
# Never commit the real URL.

[general]
resource_parser_url = https://cdn.jsdelivr.net/gh/sapphireran/quanx-resource-parsers@main/nexitally-node-parser.js
server_check_url = http://www.apple.com/generate_204

[server_remote]
<YOUR_PRIVATE_NEXITALLY_QUANTUMULT_X_URL>, tag=Nexitally, opt-parser=true, update-interval=21600, enabled=true

[policy]
static = nexitally, resource-tag-regex=^Nexitally, img-url=https://example.com/icon.png
url-latency-benchmark = nexitally-auto, resource-tag-regex=^Nexitally, check-interval=600, alive-checking=false, tolerance=50

[filter_local]
# Keep personal filter/rewrite sections here. Refreshing Nexitally must not
# replace them — that is the whole point of the parser.
host-suffix, apple.com, direct
final, nexitally
