# Sanitized Quantumult X snippet — personal local profile only.
# Replace the placeholder URL with a private Nexitally full-config URL that
# exists only on the device. Do not paste a real URL back into this repository.

[general]
resource_parser_url = https://cdn.jsdelivr.net/gh/sapphireran/quanx-resource-parsers@main/nexitally-node-parser.js
server_check_url = http://www.apple.com/generate_204
server_check_timeout = 3000

# Keep the rest of a stable profile (policy / filter / rewrite) in this file.
# The parser only refreshes the Nexitally server list.

[server_remote]
# opt-parser=true is required; without it Quantumult X stores the raw full config.
<YOUR_PRIVATE_NEXITALLY_QUANTUMULT_X_URL>, tag=Nexitally, opt-parser=true, update-interval=21600, enabled=true

[policy]
static = Proxy, Nexitally, img-url=circle.system
available = Nexitally-Auto, Nexitally, img-url=circle.system

[filter_local]
host-suffix, apple.com, direct
final, Proxy
