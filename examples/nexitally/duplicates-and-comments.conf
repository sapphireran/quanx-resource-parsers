# Comments, blanks, and exact-line duplicates should all disappear.
# Leading and trailing spaces on an otherwise identical server line still count
# as the same entry because the parser trims before it deduplicates.

[server_local]

; semicolon comment
# hash comment
// slash comment

   anytls=dup-01.example.invalid:443, password=example-password, over-tls=true, tls-host=www.apple.com, udp-relay=true, tag=dup-01
anytls=dup-01.example.invalid:443, password=example-password, over-tls=true, tls-host=www.apple.com, udp-relay=true, tag=dup-01
	anytls=dup-01.example.invalid:443, password=example-password, over-tls=true, tls-host=www.apple.com, udp-relay=true, tag=dup-01
anytls=keep-unique.example.invalid:443, password=example-password, over-tls=true, tls-host=www.apple.com, udp-relay=true, tag=keep-unique

[filter_local]
final, direct
