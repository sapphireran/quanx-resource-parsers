# Fictional Quantumult X profile for local parser examples.
# Hosts, passwords, and UUIDs below are placeholders. Do not treat them as live nodes.

[general]
resource_parser_url = https://cdn.jsdelivr.net/gh/sapphireran/quanx-resource-parsers@main/nexitally-node-parser.js
server_check_url = http://www.gstatic.com/generate_204

[dns]
no-ipv6
server = 1.1.1.1
server = 8.8.8.8

[policy]
static = Nexitally, resource-tag-regex=^Nexitally, img-url=https://example.com/icon.png
static = Final, Nexitally, direct

[server_local]
; header comment inside the section
# Traffic: 12.34 GB / 200 GB
# Expire: 2026-12-31
# Days Left: 106
# 流量: 12.34 GB / 200 GB
# 到期: 2026-12-31
# 剩余: 106 天
# 套餐: Example Plan

anytls = anytls.example.com:443, password=placeholder-anytls, over-tls=true, tls-verification=true, tls-host=anytls.example.com, udp-relay=true, tag=Example-HK-AnyTLS
shadowsocks = ss.example.com:8388, method=chacha20-ietf-poly1305, password=placeholder-ss, fast-open=false, udp-relay=true, tag=Example-JP-SS
vmess = vmess.example.com:443, method=aes-128-gcm, password=00000000-0000-4000-8000-000000000001, obfs=wss, obfs-host=vmess.example.com, obfs-uri=/vmess, tls13=true, tag=Example-SG-VMess
vless = vless.example.com:443, method=none, password=00000000-0000-4000-8000-000000000002, obfs=wss, obfs-host=vless.example.com, obfs-uri=/vless, tag=Example-US-VLESS
trojan = trojan.example.com:443, password=placeholder-trojan, over-tls=true, tls-verification=true, tls-host=trojan.example.com, tag=Example-TW-Trojan
http = http.example.com:8443, username=example-user, password=placeholder-http, over-tls=true, tls-verification=true, tag=Example-HTTP
socks5 = socks.example.com:1080, username=example-user, password=placeholder-socks, over-tls=false, tag=Example-SOCKS5

# exact duplicate of the AnyTLS line, should be dropped
anytls = anytls.example.com:443, password=placeholder-anytls, over-tls=true, tls-verification=true, tls-host=anytls.example.com, udp-relay=true, tag=Example-HK-AnyTLS

# Nexitally-style placeholder that must never become a selectable node
anytls = premium.invalid:443, password=placeholder-premium, over-tls=true, tls-verification=true, tag=[Premium] Placeholder

# traffic baked into the tag, must be excluded
shadowsocks = info.example.com:443, method=aes-256-gcm, password=unused, tag=Traffic Reset 2026-10-01

// unsupported protocol in this parser
ssr = ssr.example.com:443, protocol=origin, obfs=plain, password=unused, tag=Example-SSR-Dropped

[filter_local]
host-suffix, example.com, Nexitally
final, Final

[server_remote]
# The live Nexitally URL belongs only in a private local profile.
# https://nexitally.example/private-full-config, tag=Nexitally, opt-parser=true, update-interval=21600, enabled=true

[mitm]
hostname = -*.example.com
