# Sanitized Nexitally-style full Quantumult X configuration.
# Hosts, passwords, and tags are fictional. Do not treat this as a live subscription.

[general]
profile_img_url = https://example.invalid/nexitally.png
server_check_url = http://www.apple.com/generate_204
; resource_parser_url is configured in the *local* profile, not inside the remote full config.

[dns]
no-ipv6
server = 223.5.5.5
server = 8.8.8.8

[policy]
static = Nexitally, resource-tag-regex=^Nexitally, img-url=https://example.invalid/icon.png
available = Nexitally-Auto, resource-tag-regex=^Nexitally, server-tag-regex=^(HK|JP|SG)-

[server_local]
anytls=hk-01.example.invalid:443, password=placeholder-password, over-tls=true, tls-host=www.apple.com, udp-relay=true, tag=HK-01
anytls=jp-01.example.invalid:443, password=placeholder-password, over-tls=true, tls-host=www.apple.com, udp-relay=true, tag=JP-01
shadowsocks=sg-01.example.invalid:443, method=chacha20-ietf-poly1305, password=placeholder-password, obfs=over-tls, obfs-host=www.apple.com, udp-relay=true, tag=SG-01

; Comments and blank lines must be ignored.
# Hash comment
// Slash comment

; Metadata / placeholder rows that Nexitally embeds next to real nodes.
anytls=info.example.invalid:443, password=placeholder-password, over-tls=true, tag=Traffic: 12.3 GB / 500 GB
anytls=info.example.invalid:443, password=placeholder-password, over-tls=true, tag=Expire: 2099-12-31
anytls=info.example.invalid:443, password=placeholder-password, over-tls=true, tag=Reset: 5 Days Left
anytls=info.example.invalid:443, password=placeholder-password, over-tls=true, tag=流量: 剩余 88%
anytls=info.example.invalid:443, password=placeholder-password, over-tls=true, tag=套餐: Standard
anytls=premium.example.invalid:443, password=placeholder-password, over-tls=true, tag=[Premium] Tokyo

; Exact duplicate of HK-01 — the parser keeps the first copy only.
anytls=hk-01.example.invalid:443, password=placeholder-password, over-tls=true, tls-host=www.apple.com, udp-relay=true, tag=HK-01

[filter_remote]
https://raw.githubusercontent.com/crossutility/Quantumult-X/master/filter.snippet, tag=Sample, enabled=false

[filter_local]
host, example.invalid, reject

[rewrite_local]

[mitm]
;hostname = *.example.invalid
