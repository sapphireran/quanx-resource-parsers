# A personal profile that already uses [server_remote]. There is no
# [server_local] block, so the Nexitally parser must return an error.

[general]
resource_parser_url = https://cdn.jsdelivr.net/gh/pang990801/quanx-resource-parsers@main/nexitally-node-parser.js

[server_remote]
https://example.invalid/private-nexitally-url, tag=Nexitally, opt-parser=true, update-interval=21600, enabled=true

[policy]
static = Nexitally, resource-tag-regex=^Nexitally, server-tag-regex=.

[filter_local]
final, Nexitally
