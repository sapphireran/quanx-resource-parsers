# A profile that never declares [server_local]. The parser must error instead
# of returning an empty server list (Quantumult X would otherwise "succeed"
# and wipe the resource).

[general]
server_check_url = http://www.apple.com/generate_204

[server_remote]
anytls=remote-only.example.invalid:443, password=example-password, over-tls=true, tls-host=www.apple.com, udp-relay=true, tag=remote-only

[filter_local]
final, direct
