# Personal Quantumult X snippet.
# Copy the blocks you need into an existing stable profile.
# Replace the placeholder URL. Never commit the real URL.

[general]
# Raw GitHub. Swap to jsDelivr if raw content is slow on the device:
# resource_parser_url = https://cdn.jsdelivr.net/gh/sapphireran/quanx-resource-parsers@main/nexitally-node-parser.js
resource_parser_url = https://raw.githubusercontent.com/sapphireran/quanx-resource-parsers/main/nexitally-node-parser.js
server_check_url = http://www.apple.com/generate_204

[server_remote]
# Private Nexitally full-configuration URL. Quantumult X downloads it.
# opt-parser=true is required; without it the full profile is stored as nodes.
<YOUR_PRIVATE_NEXITALLY_QUANTUMULT_X_URL>, tag=Nexitally, opt-parser=true, update-interval=21600, enabled=true

[policy]
# resource-tag-regex follows the tag= above. New nodes appear here
# after a Server Resources refresh without editing this section again.
static = Nexitally, resource-tag-regex=^Nexitally, img-url=https://example.com/nexitally.png
available = Nexitally-Auto, resource-tag-regex=^Nexitally
url-latency-benchmark = Nexitally-Latency, resource-tag-regex=^Nexitally, check-interval=600, alive-checking=false, tolerance=100
static = Proxy, Nexitally, Nexitally-Auto, Nexitally-Latency, direct

# Leave [filter_remote], [filter_local], [rewrite_*], and [mitm] as they
# already are in the personal profile. Refreshing Nexitally must not
# replace those sections. Do not re-import Configuration File → Download.
