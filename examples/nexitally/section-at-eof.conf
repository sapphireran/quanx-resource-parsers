# [server_local] is the last section in the file. The extractor must not
# require a following [section] header.

[general]
server_check_url = http://www.apple.com/generate_204

[policy]
static = Proxy, direct

[server_local]
anytls=eof-01.example.test:443, password=example-password, over-tls=true, tls-host=www.apple.com, udp-relay=true, tag=EOF-01
shadowsocks=eof-02.example.test:443, method=aes-128-gcm, password=example-password, udp-relay=true, tag=EOF-02
