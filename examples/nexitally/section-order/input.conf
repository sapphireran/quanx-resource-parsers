[general]
resource_parser_url = https://raw.githubusercontent.com/sapphireran/quanx-resource-parsers/main/nexitally-node-parser.js

[policy]
static = Before-Servers, direct

[dns]
server = 1.1.1.1

[SERVER_LOCAL]
; uppercase section name should still match
anytls = after-policy.example.com:443, password=placeholder, over-tls=true, tag=From-Uppercase-Section
trojan = after-policy.example.com:8443, password=placeholder, over-tls=true, tag=Second-From-Section

[filter_local]
host-suffix, example.com, Before-Servers
final, direct

[server_remote]
https://example.com/not-used-by-this-parser, tag=Other, enabled=false

[rewrite_local]
^https?://example.com url reject
