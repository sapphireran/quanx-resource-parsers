# Server-looking lines after the next INI section must not be parsed.
# This is the whole reason the extractor stops at the following [header].

[server_local]
anytls=inside-01.example.invalid:443, password=example-password, over-tls=true, tls-host=www.apple.com, udp-relay=true, tag=inside-01

[filter_local]
anytls=leaked-01.example.invalid:443, password=example-password, over-tls=true, tls-host=www.apple.com, udp-relay=true, tag=should-not-appear
host-suffix, example.invalid, direct
final, direct

[server_remote]
anytls=remote-01.example.invalid:443, password=example-password, over-tls=true, tls-host=www.apple.com, udp-relay=true, tag=also-should-not-appear
