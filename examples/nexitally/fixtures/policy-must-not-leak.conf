# If the section regex is greedy, the http= policy candidate below would
# be emitted as a server. It must not appear in the parser output.

[server_local]
anytls=hk-01.example.test:443, password=example-password-not-real, over-tls=true, tls-host=www.apple.com, udp-relay=true, tag=HK-01

[policy]
http=should-not-leak.example.test:80, username=example-user, password=example-password-not-real, fast-open=false, udp-relay=false, tag=not-a-node
socks5=also-not-a-node.example.test:1080, fast-open=false, udp-relay=false, tag=also-not-a-node
static = nexitally, HK-01

[filter_local]
http=this-is-not-even-valid-here, proxy
