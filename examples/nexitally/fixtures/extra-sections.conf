# Later sections must not leak into the returned server list.

[general]
server_check_url = http://www.apple.com/generate_204

[server_local]
anytls=node-01.example.com:443, password=example-password, over-tls=true, tls-host=www.example.com, tag=Keep-Only-This

[server_remote]
https://example.com/other-sub, tag=OtherSub, enabled=true

[filter_local]
# This is not a server line, but it looks a bit like one if the parser over-reads.
host, example.com, Proxy
final, Proxy

[rewrite_local]
^https://www.example.com/api url reject-200
