# Synthetic Nexitally-style Quantumult X full configuration.
# Hosts, passwords, and UUIDs are reserved examples only.

[general]
profile_img_url = https://example.com/nexitally.png
resource_parser_url = https://example.com/parser.js
network_check_url = http://www.apple.com/library/test/success.html
server_check_url = http://www.apple.com/generate_204
dns_exclusion_list = *.cmpassport.com, *.jegotrip.com.cn

[dns]
no-ipv6
server = 223.5.5.5
server = 119.29.29.29

[policy]
static = Nexitally, resource-tag-regex=^Nexitally, img-url=https://example.com/icon.png
static = Proxy, Nexitally, DIRECT

[server_local]
; usable AnyTLS nodes
anytls=node-01.example.com:443, password=example-password, over-tls=true, tls-host=www.example.com, udp-relay=true, tag=Nexitally-HK-01
anytls=node-02.example.com:443, password=example-password, over-tls=true, tls-host=www.example.com, udp-relay=true, tag=Nexitally-JP-01

# comments and blank lines should be ignored

// duplicate of HK-01 must be dropped
anytls=node-01.example.com:443, password=example-password, over-tls=true, tls-host=www.example.com, udp-relay=true, tag=Nexitally-HK-01

; info / placeholder lines that must never become servers
anytls=info.example.com:443, password=example-password, over-tls=true, tls-host=www.example.com, tag=Traffic: 128.50 GB
anytls=info.example.com:443, password=example-password, over-tls=true, tls-host=www.example.com, tag=Expire: 2026-12-31
anytls=info.example.com:443, password=example-password, over-tls=true, tls-host=www.example.com, tag=Reset: 7 Days Left
shadowsocks=1.1.1.1:1, method=aes-128-gcm, password=example-password, tag=[Premium] Upgrade
shadowsocks=1.1.1.1:1, method=aes-128-gcm, password=example-password, tag=套餐流量剩余 50GB

; another usable protocol mixed into the managed file
trojan=node-03.example.com:443, password=example-password, over-tls=true, tls-host=www.example.com, tls-verification=true, udp-relay=true, tag=Nexitally-SG-01

[filter_remote]
https://example.com/filter.list, tag=ExampleFilter, enabled=true

[filter_local]
host, example.com, Proxy
final, Proxy

[rewrite_local]
^https://www.example.com/ping url reject-200

[mitm]
hostname = www.example.com
