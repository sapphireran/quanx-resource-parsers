# Sample Quantumult X configuration (redacted Nexitally-like managed file)
#
# This is NOT a live Nexitally download. Hosts, passwords, and tags are fake.
# The Nexitally parser should read only [server_local] and ignore every
# other section.

[general]
;resource_parser_url is irrelevant inside the *downloaded* managed file.
;The local profile is what points at nexitally-node-parser.js.
server_check_url = http://www.apple.com/generate_204
dns_exclusion_list = *.example.test

[dns]
no-ipv6
server = 223.5.5.5
server = 8.8.8.8

[policy]
static = nexitally-managed, HK-01, JP-01, SG-01, US-01, img-url=https://example.com/icon.png
url-latency-benchmark = nexitally-auto, HK-01, JP-01, SG-01, US-01, check-interval=600, tolerance=50

[server_remote]
; Managed profiles sometimes list other remotes. The parser must not emit these URLs.
https://example.com/other-nodes.txt, tag=Other, enabled=false

[server_local]
# Region nodes (keep)
anytls=hk-01.example.test:443, password=example-password-not-real, over-tls=true, tls-host=www.apple.com, udp-relay=true, tag=HK-01
anytls=jp-01.example.test:443, password=example-password-not-real, over-tls=true, tls-host=www.apple.com, udp-relay=true, tag=JP-01

; commented-out leftover, must be dropped
;anytls=retired.example.test:443, password=example-password-not-real, over-tls=true, tls-host=www.apple.com, udp-relay=true, tag=Retired

# duplicate of HK-01, must collapse to one line
anytls=hk-01.example.test:443, password=example-password-not-real, over-tls=true, tls-host=www.apple.com, udp-relay=true, tag=HK-01

anytls=sg-01.example.test:443, password=example-password-not-real, over-tls=true, tls-host=www.apple.com, udp-relay=true, tag=SG-01
anytls=us-01.example.test:443, password=example-password-not-real, over-tls=true, tls-host=www.apple.com, udp-relay=true, tag=US-01

# metadata rows that look like servers (drop)
shadowsocks=invalid.example.test:1, method=aes-128-gcm, password=example-password-not-real, tag=Traffic 12.3 GB / 200 GB
shadowsocks=invalid.example.test:1, method=aes-128-gcm, password=example-password-not-real, tag=Expire 2099-01-01
shadowsocks=invalid.example.test:1, method=aes-128-gcm, password=example-password-not-real, tag=Days Left 30
shadowsocks=invalid.example.test:1, method=aes-128-gcm, password=example-password-not-real, tag=流量 剩余 87%
shadowsocks=invalid.example.test:1, method=aes-128-gcm, password=example-password-not-real, tag=套餐 Reset 2099-02-01
shadowsocks=invalid.example.test:1, method=aes-128-gcm, password=example-password-not-real, tag=[Premium] Upgrade

// hash-style comment, drop
//anytls=also-commented.example.test:443, password=example-password-not-real, over-tls=true, tag=Commented

[filter_remote]
https://raw.githubusercontent.com/crossutility/Quantumult-X/master/filter.snippet, tag=Sample, enabled=false

[filter_local]
host-suffix, example.test, proxy
host-suffix, apple.com, direct

[rewrite_remote]
https://raw.githubusercontent.com/crossutility/Quantumult-X/master/sample-import-rewrite.snippet, tag=Sample, enabled=false

[rewrite_local]
;^https://example.com/api url reject

[mitm]
;hostname = *.example.test
