# Caveat: a standalone [Premium] line is an INI section header to the extractor.
# Servers after that line are outside [server_local] and will not be returned.
# Prefer embedding [Premium] in the tag, as traffic-and-premium.conf does.

[server_local]
anytls=before-premium.example.invalid:443, password=example-password, over-tls=true, tls-host=www.apple.com, udp-relay=true, tag=before-premium
[Premium]
anytls=after-premium.example.invalid:443, password=example-password, over-tls=true, tls-host=www.apple.com, udp-relay=true, tag=after-premium-should-drop

[filter_local]
final, direct
