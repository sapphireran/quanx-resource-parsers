# Every server prefix the Nexitally parser currently accepts.
# Line shapes follow the official Quantumult X sample.conf / server-complete.snippet.

[general]
server_check_url = http://www.apple.com/generate_204

[server_local]
anytls=anytls-01.example.invalid:443, password=example-password, over-tls=true, tls-host=www.apple.com, udp-relay=true, tag=anytls-standard-tls-01
anytls=anytls-02.example.invalid:443, password=example-password, over-tls=true, tls-host=www.apple.com, reality-base64-pubkey=k4Uxez0sjl8bKaZH2Vgi8-WDFshML51QkxKFLWFIONk, reality-hex-shortid=0123456789abcdef, udp-relay=true, tag=anytls-reality-tls-01
shadowsocks=ss-01.example.invalid:80, method=chacha20, password=pwd, obfs=http, obfs-host=www.apple.com, obfs-uri=/resource/file, fast-open=false, udp-relay=false, tag=ss-obfs-http-01
shadowsocks=ss-02.example.invalid:443, method=aes-128-gcm, password=pwd, obfs=wss, obfs-uri=/ws, tls13=true, fast-open=false, udp-relay=false, tag=ss-ws-tls-02
vmess=vmess-01.example.invalid:443, method=none, password=23ad6b10-8d1a-40f7-8ad0-e3e35cd32291, obfs=over-tls, fast-open=false, udp-relay=false, tag=vmess-tls-01
vless=vless-01.example.invalid:443, method=none, password=23ad6b10-8d1a-40f7-8ad0-e3e35cd32291, obfs=wss, obfs-uri=/ws, fast-open=false, udp-relay=false, tag=vless-ws-tls-01
trojan=trojan-01.example.invalid:443, password=pwd, over-tls=true, tls-verification=true, tls13=true, fast-open=false, udp-relay=false, tag=trojan-tls-02
http=http-01.example.invalid:443, username=name, password=pwd, over-tls=true, tls-host=example.invalid, tls-verification=true, fast-open=false, udp-relay=false, tag=http-tls-01
socks5=socks5-01.example.invalid:443, username=name, password=pwd, over-tls=true, tls-host=example.invalid, tls-verification=true, fast-open=false, udp-relay=false, tag=socks5-tls-01

[filter_local]
final, direct
