# Synthetic Nexitally-style managed Quantumult X configuration.
# Hosts, passwords, UUIDs, and Reality fields are placeholders.
# Do not treat any line as a live node.

[general]
profile_img_url = https://example.com/nexitally.png
resource_parser_url = https://raw.githubusercontent.com/sapphireran/quanx-resource-parsers/main/nexitally-node-parser.js
server_check_url = http://www.apple.com/generate_204
server_check_timeout = 5000

[dns]
no-ipv6
server = 223.5.5.5
server = 119.29.29.29

[policy]
static = Nexitally, HK-01, JP-01, SG-01, img-url=https://example.com/nexitally.png
static = Proxy, Nexitally, direct
available = Auto, HK-01, JP-01, SG-01

[server_remote]
; The managed profile may already list other remotes. The personal
; profile should ignore this section and keep its own [server_remote].

[filter_remote]
FILTER_LAN, tag=LAN, force-policy=direct, inserted-resource=true, enabled=true
FILTER_REGION, tag=CN, force-policy=direct, inserted-resource=true, enabled=true

[rewrite_remote]
; https://example.com/rewrite.snippet, tag=Sample, enabled=false

[server_local]
# Comments and blanks in this section must not become servers.
