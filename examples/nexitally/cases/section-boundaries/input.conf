[general]
server_check_url = http://www.apple.com/generate_204

[policy]
static = Proxy, TW-Tpe-01, KR-Sel-01

[server_local]
anytls = tw-tpe-01.example.test:443, password=example-anytls-password, over-tls=true, tls-verification=true, tls-host=tw-tpe-01.example.test, tag=TW-Tpe-01
shadowsocks = kr-sel-01.example.test:443, method=chacha20-ietf-poly1305, password=example-ss-password, tag=KR-Sel-01

[filter_local]
# The next line looks like a server entry on purpose. It must not be parsed.
shadowsocks = leak.example.test:443, method=chacha20-ietf-poly1305, password=must-not-appear, tag=LEAK-IF-GREEDY
host-suffix, example.test, Proxy
final, Proxy

[rewrite_remote]
https://cdn.example.test/rewrite.txt, tag=Rewrite, enabled=true

[server_remote]
https://cdn.example.test/other.txt, tag=Other, enabled=false
