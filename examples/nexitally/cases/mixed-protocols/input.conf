[server_local]
anytls = anytls.example.test:443, password=example-anytls-password, over-tls=true, tls-verification=true, tls-host=anytls.example.test, tag=Example-AnyTLS
shadowsocks = ss.example.test:8388, method=chacha20-ietf-poly1305, password=example-ss-password, udp-relay=true, tag=Example-SS
vmess = vmess.example.test:443, method=aes-128-gcm, password=00000000-0000-4000-8000-000000000002, obfs=wss, obfs-host=vmess.example.test, obfs-uri=/vmess, tls13=true, tag=Example-VMess
vless = vless.example.test:443, method=none, password=00000000-0000-4000-8000-000000000003, obfs=wss, obfs-host=vless.example.test, obfs-uri=/vless, tls13=true, tag=Example-VLESS
trojan = trojan.example.test:443, password=example-trojan-password, over-tls=true, tls-host=trojan.example.test, tls-verification=true, tag=Example-Trojan
http = http.example.test:8443, username=example-user, password=example-http-password, over-tls=true, tls-verification=true, tls-host=http.example.test, tag=Example-HTTP
socks5 = socks.example.test:1080, username=example-user, password=example-socks-password, over-tls=false, tag=Example-SOCKS5

[server_remote]
https://cdn.example.test/other.txt, tag=Other, enabled=false
