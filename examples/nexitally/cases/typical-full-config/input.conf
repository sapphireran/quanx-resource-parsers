; Fake Nexitally-style Quantumult X full configuration for local examples.
; Hostnames and secrets are invented. Do not treat this as a working profile.

[general]
dns_exclusion_list = *.example.test, *.apple.com
geo_location_checker = http://ip-api.example.test/json/, {"key":"query"}
resource_parser_url = https://example.test/unused-in-fixture.js
network_check_url = http://www.apple.com/generate_204
server_check_url = http://www.apple.com/generate_204
profile_img_url = https://cdn.example.test/icon.png

[dns]
no-system-dns = false
server = 1.1.1.1
server = 8.8.8.8
server = /example.test/1.1.1.1

[policy]
static = Proxy, HK-Central-01, JP-Osaka-01, US-Sfo-01, img-url=circle.system
available = Auto, HK-Central-01, JP-Osaka-01, interval=600, tolerance=100
static = Final, Proxy, direct

[server_local]
; region: hong kong
anytls = hk-central-01.example.test:443, password=example-anytls-password, over-tls=true, tls-verification=true, tls-host=hk-central-01.example.test, udp-relay=true, tag=HK-Central-01
anytls = hk-central-02.example.test:443, password=example-anytls-password, over-tls=true, tls-verification=true, tls-host=hk-central-02.example.test, udp-relay=true, tag=HK-Central-02

; region: japan
shadowsocks = jp-osaka-01.example.test:443, method=chacha20-ietf-poly1305, password=example-ss-password, obfs=http, obfs-host=download.windowsupdate.com, udp-relay=true, tag=JP-Osaka-01

; region: united states
vmess = us-sfo-01.example.test:443, method=aes-128-gcm, password=00000000-0000-4000-8000-000000000001, obfs=wss, obfs-host=us-sfo-01.example.test, obfs-uri=/example, tls13=true, udp-relay=true, tag=US-Sfo-01

; account banners — must be dropped
shadowsocks = 127.0.0.1:1, method=aes-128-gcm, password=placeholder, tag=Traffic: 128.00 GB
shadowsocks = 127.0.0.1:1, method=aes-128-gcm, password=placeholder, tag=Expire: 2099-12-31
shadowsocks = 127.0.0.1:1, method=aes-128-gcm, password=placeholder, tag=[Premium]

[filter_remote]
https://cdn.example.test/fake-filter.txt, tag=FakeFilter, update-interval=86400, enabled=true

[filter_local]
host-suffix, apple.com, direct
host-suffix, icloud.com, direct
host-suffix, example.test, Proxy
geoip, cn, direct
final, Proxy

[rewrite_local]
^https?://www\.example\.test/ad url reject-200

[mitm]
hostname = -*.example.test
