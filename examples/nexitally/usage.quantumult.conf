# Local Quantumult X wiring for the Nexitally node parser.
#
# Keep this file in the repository as a reminder. Copy the two blocks into
# the device profile and replace the placeholder URL there — never here.

[general]
# Public parser script. Safe to share.
resource_parser_url = https://cdn.jsdelivr.net/gh/pang990801/quanx-resource-parsers@main/nexitally-node-parser.js
server_check_url = http://www.example.com/generate_204

[server_remote]
# Private Nexitally full-configuration URL. Replace only on the device.
# Do not commit the real value.
<YOUR_PRIVATE_NEXITALLY_QUANTUMULT_X_URL>, tag=Nexitally, opt-parser=true, update-interval=21600, enabled=true

[policy]
# Local policy groups stay in the local profile. Refreshing the Nexitally
# server resource must not rewrite this section.
static = Nexitally, resource-tag-regex=^Nexitally, img-url=https://www.example.com/icon.png
static = Final, Nexitally, direct

[filter_local]
geoip, cn, direct
final, Nexitally
