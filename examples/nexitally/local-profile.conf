# Personal Quantumult X profile that keeps local policy / filter / rewrite
# sections and refreshes Nexitally nodes through [server_remote].
#
# Replace <YOUR_PRIVATE_NEXITALLY_QUANTUMULT_X_URL> with the Configuration
# File → Download URL from the Nexitally dashboard. Keep that URL only on
# the device. Never commit it here.

[general]
resource_parser_url = https://cdn.jsdelivr.net/gh/pang990801/quanx-resource-parsers@main/nexitally-node-parser.js
server_check_url = http://www.apple.com/generate_204
dns_exclusion_list = *.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me

[dns]
no-ipv6
server = 223.5.5.5
server = 119.29.29.29

[policy]
static = Nexitally, resource-tag-regex=^Nexitally, server-tag-regex=., img-url=https://example.invalid/nexitally.png
available = Nexitally-Auto, resource-tag-regex=^Nexitally, server-tag-regex=.
static = Proxy, Nexitally, Nexitally-Auto, direct

[server_remote]
<YOUR_PRIVATE_NEXITALLY_QUANTUMULT_X_URL>, tag=Nexitally, opt-parser=true, update-interval=21600, enabled=true

[server_local]
; Personal nodes stay here and are never touched by the parser.
; socks5=127.0.0.1:1080, fast-open=false, udp-relay=false, tag=Local SOCKS

[filter_remote]
; Add your own filter resources. The Nexitally full-config filters are ignored.

[filter_local]
geoip, cn, direct
ip-cidr, 10.0.0.0/8, direct
ip-cidr, 127.0.0.0/8, direct
ip-cidr, 172.16.0.0/12, direct
ip-cidr, 192.168.0.0/16, direct
final, Proxy

[rewrite_remote]
; Keep personal rewrite resources. Do not import the managed full profile.

[mitm]
;hostname = 
