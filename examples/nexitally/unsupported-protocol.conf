# Unknown prefixes are ignored. Only the documented Quantumult X server
# prefixes survive. hysteria2 is used here as a stand-in for "not supported".

[server_local]
hysteria2=hy2-01.example.invalid:443, password=example-password, tag=hy2-should-drop
wireguard=wg-01.example.invalid:51820, tag=wg-should-drop
anytls=keep-01.example.invalid:443, password=example-password, over-tls=true, tls-host=www.apple.com, udp-relay=true, tag=keep-01
ss=legacy-01.example.invalid:443, method=aes-128-gcm, password=pwd, tag=ss-alias-should-drop

[filter_local]
final, direct
