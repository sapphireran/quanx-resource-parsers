# Info nodes are sometimes emitted as real server lines, not comments.
# The parser drops any line that matches the traffic / expiry / premium keywords
# even when the line otherwise looks like a supported server.

[server_local]
anytls=keep-01.example.invalid:443, password=example-password, over-tls=true, tls-host=www.apple.com, udp-relay=true, tag=keep-tokyo-01
shadowsocks=info-01.example.invalid:443, method=aes-128-gcm, password=pwd, tag=Traffic: 12.00 GB / 500.00 GB
shadowsocks=info-02.example.invalid:443, method=aes-128-gcm, password=pwd, tag=Expire: 2026-12-31
shadowsocks=info-03.example.invalid:443, method=aes-128-gcm, password=pwd, tag=Reset in 5 Days Left
shadowsocks=info-04.example.invalid:443, method=aes-128-gcm, password=pwd, tag=套餐剩余流量 88%
shadowsocks=info-05.example.invalid:443, method=aes-128-gcm, password=pwd, tag=流量已用 12 GB
shadowsocks=info-06.example.invalid:443, method=aes-128-gcm, password=pwd, tag=到期 2026-12-31
anytls=locked-01.example.invalid:443, password=example-password, over-tls=true, tls-host=www.apple.com, udp-relay=true, tag=西雅图 [Premium]
anytls=keep-02.example.invalid:443, password=example-password, over-tls=true, tls-host=www.apple.com, udp-relay=true, tag=keep-osaka-01

[policy]
static = Proxy, keep-tokyo-01, keep-osaka-01, direct
