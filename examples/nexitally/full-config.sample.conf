# Synthetic Nexitally-style Quantumult X full configuration.
#
# This file is documentation only. Hosts, passwords, tags, and URLs are
# placeholders. It is shaped like the managed "Download configuration"
# payload that Quantumult X would feed to nexitally-node-parser.js:
# a complete profile whose [server_local] section mixes usable AnyTLS
# nodes with traffic/expiry rows, [Premium] placeholders, comments, and a
# duplicate line.
#
# Do not treat these servers as real endpoints.

[general]
profile_img_url = https://example.com/icons/nexitally.png
resource_parser_url = https://cdn.jsdelivr.net/gh/sapphireran/quanx-resource-parsers@main/nexitally-node-parser.js
server_check_url = http://www.apple.com/generate_204
server_check_timeout = 5000

[dns]
server = 1.1.1.1
server = 8.8.8.8
no-ipv6

[policy]
static = Nexitally, resource-tag-regex=^Nexitally, img-url=https://example.com/icons/nexitally.png
static = Final, Nexitally, direct

[server_local]
# Rows that advertise quota / expiry are not servers. The parser must drop them.
shadowsocks=info.example.com:1, method=aes-128-gcm, password=unused, tag=Traffic: 12.34 GB / 500 GB
anytls=expire.example.com:443, password=unused, over-tls=true, tls-host=www.example.com, tag=Expire: 2099-12-31
anytls=reset.example.com:443, password=unused, over-tls=true, tls-host=www.example.com, tag=Reset: 1st of month
anytls=days.example.com:443, password=unused, over-tls=true, tls-host=www.example.com, tag=Days Left: 30
anytls=cn-traffic.example.com:443, password=unused, over-tls=true, tls-host=www.example.com, tag=流量 12.34 GB
anytls=cn-expire.example.com:443, password=unused, over-tls=true, tls-host=www.example.com, tag=到期 2099-12-31
anytls=cn-left.example.com:443, password=unused, over-tls=true, tls-host=www.example.com, tag=剩余 20 天
anytls=cn-plan.example.com:443, password=unused, over-tls=true, tls-host=www.example.com, tag=套餐 Standard

; Commented nodes must not be imported.
;anytls=commented.example.com:443, password=example-password-not-real, over-tls=true, tls-host=www.example.com, tag=HK-commented
#anytls=hash-comment.example.com:443, password=example-password-not-real, over-tls=true, tls-host=www.example.com, tag=HK-hash
//anytls=slash-comment.example.com:443, password=example-password-not-real, over-tls=true, tls-host=www.example.com, tag=HK-slash

anytls=hk-1.example.com:443, password=example-password-not-real, over-tls=true, tls-host=www.example.com, udp-relay=true, tag=HK-01
anytls=hk-2.example.com:443, password=example-password-not-real, over-tls=true, tls-host=www.example.com, udp-relay=true, tag=HK-02
anytls=jp-1.example.com:443, password=example-password-not-real, over-tls=true, tls-host=www.apple.com, udp-relay=true, tag=JP-01
anytls=sg-premium.example.com:443, password=example-password-not-real, over-tls=true, tls-host=www.example.com, udp-relay=true, tag=SG-01 [Premium]
anytls=us-1.example.com:443, password=example-password-not-real, over-tls=true, tls-host=www.example.com, udp-relay=true, tag=US-01
anytls=jp-reality.example.com:443, password=example-password-not-real, over-tls=true, tls-host=www.apple.com, reality-base64-pubkey=k4Uxez0sjl8bKaZH2Vgi8-WDFshML51QkxKFLWFIONk, reality-hex-shortid=0123456789abcdef, udp-relay=true, tag=JP-02-Reality

# Exact duplicate of HK-01: keep the first occurrence only.
anytls=hk-1.example.com:443, password=example-password-not-real, over-tls=true, tls-host=www.example.com, udp-relay=true, tag=HK-01

[server_remote]
# The managed full configuration may list other resources. The parser must
# ignore everything outside [server_local].
https://example.com/unrelated-servers.txt, tag=Other, enabled=false

[filter_local]
geoip, cn, direct
final, Nexitally

[rewrite_local]

[mitm]
