# The parser never rewrites [policy], [filter_remote], or [filter_local].
# After you attach the Nexitally URL as a server resource, point existing
# policy groups at the resource tag instead of at individual [server_local]
# names that used to arrive with the full-profile download.

[policy]
static = Nexitally, resource-tag-regex=^Nexitally, img-url=https://example.com/icon.png
static = Proxy, Nexitally, direct
static = Final, Proxy, direct
