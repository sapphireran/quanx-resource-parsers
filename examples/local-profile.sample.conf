# Sample *local* Quantumult X profile after the Nexitally parser is attached.
# Replace the placeholder URL only on the device. Never commit a filled copy.
#
# This file is a teaching snippet, not a complete production profile.
# DNS, filter, and MITM sections are abbreviated on purpose.

[general]
server_check_url = http://www.apple.com/generate_204
server_check_timeout = 5000
resource_parser_url = https://cdn.jsdelivr.net/gh/sapphireran/quanx-resource-parsers@main/nexitally-node-parser.js

[dns]
no-ipv6
server = 223.5.5.5
server = 119.29.29.29

[policy]
# resource-tag-regex matches the [server_remote] tag, not a node name.
static = Nexitally, resource-tag-regex=^Nexitally, server-tag-regex=., img-url=https://example.com/nexitally.png
available = Nexitally-Auto, resource-tag-regex=^Nexitally, server-tag-regex=., check-interval=600
url-latency-benchmark = Nexitally-Latency, resource-tag-regex=^Nexitally, server-tag-regex=., check-interval=600, alive-checking=false, tolerance=100

# Region slices stay local. Adjust prefixes when the provider renames tags.
static = Nexitally-HK, resource-tag-regex=^Nexitally, server-tag-regex=^(HK|HongKong|Hong Kong)
static = Nexitally-JP, resource-tag-regex=^Nexitally, server-tag-regex=^(JP|Japan|Tokyo)
static = Nexitally-SG, resource-tag-regex=^Nexitally, server-tag-regex=^(SG|Singapore)
static = Nexitally-US, resource-tag-regex=^Nexitally, server-tag-regex=^(US|United States|America)

static = PROXY, Nexitally-Latency, Nexitally-Auto, Nexitally, direct
static = Final, PROXY, direct

[server_remote]
# Private configuration-download URL. Keep this line only on the device.
<YOUR_PRIVATE_NEXITALLY_QUANTUMULT_X_URL>, tag=Nexitally, opt-parser=true, update-interval=21600, enabled=true

# Official Quantumult X sample snippet — no parser required.
https://raw.githubusercontent.com/crossutility/Quantumult-X/master/server.snippet, tag=Sample-01, opt-parser=false, enabled=false

[filter_remote]
https://raw.githubusercontent.com/crossutility/Quantumult-X/master/filter.snippet, tag=Sample, enabled=false

[rewrite_remote]
https://raw.githubusercontent.com/crossutility/Quantumult-X/master/sample-import-rewrite.snippet, tag=Sample, enabled=false

[server_local]
; Personal nodes that are not part of the Nexitally resource stay here.
;socks5=127.0.0.1:1080, tag=local-socks

[filter_local]
ip-cidr, 10.0.0.0/8, direct
ip-cidr, 127.0.0.0/8, direct
ip-cidr, 172.16.0.0/12, direct
ip-cidr, 192.168.0.0/16, direct
geoip, cn, direct
final, Final

[rewrite_local]

[task_local]

[mitm]
; hostname = -*.example.com
