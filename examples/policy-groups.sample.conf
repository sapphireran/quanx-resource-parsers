# Policy-only excerpt for a personal profile that consumes the parsed
# Nexitally resource. Copy the [policy] block; do not paste a live URL.

[policy]
# All nodes imported from the resource whose tag is exactly "Nexitally".
static = Nexitally, resource-tag-regex=^Nexitally, server-tag-regex=.

# First available candidate. Quantumult X launches a concurrent URL test
# when the group is used and currently marked unavailable.
available = Nexitally-Auto, resource-tag-regex=^Nexitally, server-tag-regex=., check-interval=600

# Best URL-latency result. tolerance is milliseconds.
url-latency-benchmark = Nexitally-Latency, resource-tag-regex=^Nexitally, server-tag-regex=., check-interval=600, alive-checking=false, tolerance=100

# Session persistence by destination hash — useful for sites that bind cookies
# to a source address.
dest-hash = Nexitally-Sticky, resource-tag-regex=^Nexitally, server-tag-regex=.

# Round-robin across the same resource.
round-robin = Nexitally-RR, resource-tag-regex=^Nexitally, server-tag-regex=.

# Narrow slices. These regexes match the server tag field, not the resource tag.
static = HK, resource-tag-regex=^Nexitally, server-tag-regex=^(HK|HongKong|Hong Kong|🇭🇰)
static = JP, resource-tag-regex=^Nexitally, server-tag-regex=^(JP|Japan|Tokyo|🇯🇵)
static = SG, resource-tag-regex=^Nexitally, server-tag-regex=^(SG|Singapore|🇸🇬)
static = TW, resource-tag-regex=^Nexitally, server-tag-regex=^(TW|Taiwan|Taipei|🇹🇼)
static = US, resource-tag-regex=^Nexitally, server-tag-regex=^(US|United States|America|🇺🇸)

# Streaming / general exit. Keep provider-specific names out of filter rules
# by pointing filters at these stable local group names instead.
static = Streaming, HK, TW, JP, SG, US, Nexitally-Latency
static = PROXY, Nexitally-Latency, Nexitally-Auto, HK, JP, SG, US, direct
