# Skeleton of a stable local Quantumult X profile that refreshes Nexitally
# nodes through [server_remote] instead of re-importing the managed full file.
#
# This file is documentation, not a ready-to-import live profile:
# - policy candidates use example tags from examples/fixtures/
# - filter/rewrite remotes are placeholders
# - the Nexitally URL must stay on the device only

[general]
profile_img_url = https://example.com/avatar.png
resource_parser_url = https://cdn.jsdelivr.net/gh/sapphireran/quanx-resource-parsers@main/nexitally-node-parser.js
server_check_url = http://www.apple.com/generate_204
dns_exclusion_list = *.example.test

[dns]
no-ipv6
server = 1.1.1.1
server = 8.8.8.8

[policy]
# resource-tag-regex keeps this group attached to the Nexitally server resource
# after the remote list is refreshed. Tune the regex to the tag= value below.
static = Proxy, resource-tag-regex=^Nexitally, img-url=https://example.com/proxy.png
static = Final, Proxy, direct, img-url=https://example.com/final.png

[server_remote]
<YOUR_PRIVATE_NEXITALLY_QUANTUMULT_X_URL>, tag=Nexitally, opt-parser=true, update-interval=21600, enabled=true

[server_local]
# Optional extra nodes that are not part of the Nexitally resource.

[filter_local]
host, example.test, direct
geoip, cn, direct
final, Final

[filter_remote]
https://example.com/filter.txt, tag=ExampleFilter, update-interval=86400, enabled=true

[rewrite_local]
# Keep personal rewrite snippets here so a Nexitally full-config download
# cannot replace them.

[rewrite_remote]
# https://example.com/rewrite.txt, tag=ExampleRewrite, opt-parser=false, enabled=true

[mitm]
hostname = -*.example.test
