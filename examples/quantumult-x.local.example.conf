# Example of a *local* Quantumult X profile that uses this parser.
#
# Keep the Nexitally URL only on the device. Never commit it.
# Replace the parser URL with a pinned commit if you want a frozen script.

[general]
resource_parser_url = https://raw.githubusercontent.com/sapphireran/quanx-resource-parsers/main/nexitally-node-parser.js
server_check_url = http://www.apple.com/generate_204

[dns]
no-ipv6
server = 1.1.1.1

[server_remote]
; Replace the placeholder URL with the private Nexitally Quantumult X
; full-configuration URL from the provider dashboard. Keep opt-parser=true.
https://subscription.example.test/quantumult-x, tag=Nexitally, opt-parser=true, update-interval=21600, enabled=true

; Optional: keep only Hong Kong and Singapore tags.
; https://subscription.example.test/quantumult-x#in=HK+SG, tag=Nexitally-Asia, opt-parser=true, update-interval=21600, enabled=true

[server_local]
; Personal extra nodes stay here. The parser never touches this section.

[policy]
static = Proxy, Nexitally, direct
static = Final, Proxy, direct

[filter_local]
geoip, cn, direct
final, Proxy
