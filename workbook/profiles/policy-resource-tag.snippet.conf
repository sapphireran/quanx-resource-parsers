# Personal Quantumult X snippet — policy follows the resource tag.
# These lines stay in the local profile. The parser does not emit them.

[policy]
static = Nexitally, Nexitally, img-url=https://example.invalid/nexitally.png
static = Proxy, Nexitally, direct
static = JP, resource-tag-regex=Nexitally, server-tag-regex=^JP-, img-url=https://example.invalid/jp.png
static = HK, resource-tag-regex=Nexitally, server-tag-regex=^HK-, img-url=https://example.invalid/hk.png
