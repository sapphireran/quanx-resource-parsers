# Public shape of a stable personal Quantumult X profile.
# Replace the URL token on the device only.

[general]
resource_parser_url = https://cdn.jsdelivr.net/gh/sapphireran/quanx-resource-parsers@main/nexitally-node-parser.js
server_check_url = http://www.google.com/generate_204

[dns]
no-ipv6
server = 223.5.5.5

[policy]
static = Proxy, resource-tag-regex=^Nexitally, server-tag-regex=.
available = Nexitally-Auto, resource-tag-regex=^Nexitally, server-tag-regex=^(HK|SG|JP|US)

[server_remote]
YOUR_PRIVATE_NEXITALLY_QUANTUMULT_X_URL, tag=Nexitally, opt-parser=true, update-interval=21600, enabled=true

[filter_local]
final, Proxy

# [server_local] stays empty on the device. Nodes come from the parsed resource.
