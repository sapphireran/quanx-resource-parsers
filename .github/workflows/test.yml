name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  parser-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run Nexitally parser fixtures
        run: node test/nexitally-node-parser.test.js
