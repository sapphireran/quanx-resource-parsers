name: Check examples

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check-examples:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run example fixtures
        run: node scripts/check-examples.js
