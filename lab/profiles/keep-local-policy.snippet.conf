# After the parser returns server lines, Quantumult X attaches them to the
# server resource tag (Nexitally). Local policy groups can select those
# nodes with resource-tag-regex / server-tag-regex instead of listing
# every node name. Re-downloading the full Nexitally config is unnecessary.

[policy]
static = Nexitally, resource-tag-regex=^Nexitally, server-tag-regex=.
available = Nexitally-Auto, resource-tag-regex=^Nexitally, server-tag-regex=.
url-latency-benchmark = Nexitally-Bench, resource-tag-regex=^Nexitally, server-tag-regex=., check-interval=600, alive-checking=false, tolerance=100
static = Proxy, Nexitally, Nexitally-Auto, Nexitally-Bench, direct
