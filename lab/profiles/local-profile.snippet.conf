# Personal Quantumult X profile fragment.
# Replace the placeholder URL on the device only. Never commit the real URL.

[general]
resource_parser_url = https://raw.githubusercontent.com/sapphireran/quanx-resource-parsers/main/nexitally-node-parser.js
;resource_parser_url = https://cdn.jsdelivr.net/gh/sapphireran/quanx-resource-parsers@main/nexitally-node-parser.js
server_check_url = http://www.apple.com/generate_204

[dns]
no-ipv6
server = 223.5.5.5
server = 119.29.29.29

[policy]
static = Nexitally, resource-tag-regex=^Nexitally, server-tag-regex=., img-url=https://example.invalid/icon.png
available = Nexitally-Auto, resource-tag-regex=^Nexitally, server-tag-regex=.
static = Proxy, Nexitally, Nexitally-Auto, direct

[server_remote]
<YOUR_PRIVATE_NEXITALLY_QUANTUMULT_X_URL>, tag=Nexitally, opt-parser=true, update-interval=21600, enabled=true

[server_local]
; Keep personal extra nodes here. The Nexitally resource is remote.

[filter_remote]
; keep your own rule sets

[filter_local]
geoip, cn, direct
final, Proxy

[rewrite_local]
; keep your own rewrites
